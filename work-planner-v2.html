<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新意念计划管理系统 - 云端版</title>
    <style>
        /* ===== 设计令牌 ===== */
        :root {
            --primary: #5c6bc0;
            --primary-dark: #3949ab;
            --primary-light: #e8eaf6;
            --primary-grad: linear-gradient(135deg, #5c6bc0 0%, #7c4dbb 100%);

            --success: #43a047;
            --warning: #fb8c00;
            --danger:  #e53935;
            --info:    #1e88e5;
            --gray:    #757575;

            --bg-body:    #eef0f8;
            --bg-card:    #ffffff;
            --bg-subtle:  #f7f8fc;

            --border:     #e8eaf0;
            --radius-sm:  8px;
            --radius-md:  12px;
            --radius-lg:  16px;
            --radius-xl:  24px;

            --shadow-sm:  0 1px 4px rgba(92,107,192,0.08);
            --shadow-md:  0 4px 16px rgba(92,107,192,0.12);
            --shadow-lg:  0 8px 32px rgba(92,107,192,0.16);

            --text-primary:   #1a1f36;
            --text-secondary: #5a607a;
            --text-muted:     #9ea7c4;

            --font: 'Microsoft YaHei', 'PingFang SC', 'Segoe UI', Arial, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font);
            background: var(--bg-body);
            min-height: 100vh;
            padding: 24px 20px;
            color: var(--text-primary);
        }

        .container { max-width: 1400px; margin: 0 auto; }

        /* ===== Header ===== */
        .header {
            background: var(--bg-card);
            padding: 24px 32px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header h1 {
            color: var(--text-primary);
            font-size: 1.6em;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 0.95em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* ===== 同步状态 ===== */
        .sync-status {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 6px 14px;
            background: #e8f5e9;
            border-radius: 20px;
            font-size: 13px;
            color: #2e7d32;
            font-weight: 600;
        }
        .sync-status.syncing { background: #fff3e0; color: #e65100; }
        .sync-status.error   { background: #ffebee; color: #c62828; }

        .sync-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: #4caf50;
            animation: pulse 2s infinite;
        }
        .sync-status.syncing .sync-dot { background: #ff9800; animation: pulse 0.5s infinite; }
        .sync-status.error   .sync-dot { background: #f44336; animation: none; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.4; }
        }

        /* ===== Tabs ===== */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .tab {
            padding: 11px 24px;
            background: var(--bg-card);
            border: 2px solid transparent;
            border-radius: var(--radius-xl);
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            transition: all 0.2s ease;
            box-shadow: var(--shadow-sm);
            letter-spacing: 0.2px;
        }
        .tab:hover {
            border-color: var(--primary);
            color: var(--primary);
            box-shadow: var(--shadow-md);
        }
        .tab.active {
            background: var(--primary-grad);
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 16px rgba(92,107,192,0.35);
        }

        /* ===== 统计卡片 ===== */
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px;
            margin-bottom: 18px;
        }

        .stat-card {
            background: var(--bg-card);
            padding: 18px 20px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            gap: 14px;
            transition: box-shadow 0.2s, transform 0.2s;
            border-left: 4px solid transparent;
        }
        .stat-card:nth-child(1) { border-left-color: var(--primary); }
        .stat-card:nth-child(2) { border-left-color: var(--info); }
        .stat-card:nth-child(3) { border-left-color: var(--success); }
        .stat-card:nth-child(4) { border-left-color: var(--gray); }
        .stat-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }

        .stat-icon { font-size: 2em; opacity: 0.85; }
        .stat-info { flex: 1; }
        .stat-label { color: var(--text-muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
        .stat-value { color: var(--text-primary); font-size: 1.9em; font-weight: 700; line-height: 1; }

        /* ===== 内容区 ===== */
        .content-area {
            background: var(--bg-card);
            padding: 28px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            min-height: 600px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--border);
        }

        .section-header h2 {
            color: var(--text-primary);
            font-size: 1.5em;
            font-weight: 700;
        }

        /* ===== 按钮 ===== */
        .add-btn {
            padding: 10px 22px;
            background: var(--primary-grad);
            color: white;
            border: none;
            border-radius: var(--radius-xl);
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(92,107,192,0.3);
            letter-spacing: 0.2px;
        }
        .add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(92,107,192,0.4);
        }

        /* ===== 计划列表 ===== */
        .plan-list { display: flex; flex-direction: column; gap: 12px; }

        .plan-card {
            background: var(--bg-card);
            border-left: 4px solid var(--primary);
            border-radius: var(--radius-md);
            padding: 20px 22px;
            transition: box-shadow 0.2s, transform 0.2s;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            border-left-width: 4px;
            border-left-color: var(--primary);
        }

        .plan-card.urgent {
            background: linear-gradient(135deg, #fff8f7 0%, #fff3f3 100%);
            border-left-color: var(--danger);
            box-shadow: 0 2px 12px rgba(229,57,53,0.12);
        }
        .plan-card.urgent .plan-title { color: var(--danger); }

        .plan-card.near {
            background: linear-gradient(135deg, #fffdf5 0%, #fff8e8 100%);
            border-left-color: var(--warning);
            box-shadow: 0 2px 12px rgba(251,140,0,0.10);
        }

        .plan-card.normal {
            background: linear-gradient(135deg, #f6fbf6 0%, #ffffff 100%);
            border-left-color: var(--success);
        }

        .plan-card.far {
            background: var(--bg-subtle);
            border-left-color: #c5cae9;
            opacity: 0.85;
        }

        .plan-card.from-monthly {
            /* 月计划转移到周计划的计划不再特殊突显 */
        }

        .plan-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .plan-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 14px;
        }

        .plan-title {
            font-size: 1.1em;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
            letter-spacing: 0.3px;
            line-height: 1.4;
        }

        .plan-meta {
            display: flex;
            gap: 10px;
            color: var(--text-secondary);
            font-size: 13px;
            align-items: center;
            flex-wrap: wrap;
        }

        .plan-actions { display: flex; gap: 8px; }

        .action-btn {
            padding: 6px 14px;
            border: none;
            border-radius: var(--radius-xl);
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s ease;
            letter-spacing: 0.2px;
        }
        .edit-btn   { background: #fff8e1; color: #f57c00; border: 1px solid #ffe082; }
        .delete-btn { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; }
        .action-btn:hover { transform: scale(1.05); box-shadow: var(--shadow-sm); }

        /* ===== 弹窗 ===== */
        .modal {
            display: none;
            position: fixed;
            z-index: 99999;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background: rgba(26,31,54,0.55);
            backdrop-filter: blur(2px);
        }
        .modal.show { display: flex; justify-content: center; align-items: center; }

        .modal-content {
            background: var(--bg-card);
            padding: 32px;
            border-radius: var(--radius-lg);
            width: 90%;
            max-width: 700px;
            max-height: 88vh;
            overflow-y: auto;
            box-shadow: 0 16px 56px rgba(26,31,54,0.28);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--border);
        }
        .modal-header h3 { color: var(--text-primary); font-size: 1.4em; font-weight: 700; }

        .close-btn { background: none; border: none; font-size: 26px; cursor: pointer; color: var(--text-muted); transition: color 0.2s; }
        .close-btn:hover { color: var(--text-primary); }

        /* ===== 表单 ===== */
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            margin-bottom: 7px;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 13px;
            letter-spacing: 0.3px;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            box-sizing: border-box;
            color: var(--text-primary);
            background: var(--bg-subtle);
            transition: border-color 0.2s, box-shadow 0.2s;
            user-select: text;
            -webkit-user-select: text;
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 3px rgba(92,107,192,0.12);
        }
        .form-group textarea { resize: vertical; min-height: 90px; }

        .form-row { display: flex; gap: 14px; }
        .form-row .form-group { flex: 1; }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            padding-bottom: 8px;
        }
        .modal-actions button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: var(--radius-xl);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .save-btn {
            background: var(--primary-grad);
            color: white;
            box-shadow: 0 2px 8px rgba(92,107,192,0.3);
        }
        .save-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(92,107,192,0.4); }
        .cancel-btn { background: var(--bg-subtle); color: var(--text-secondary); border: 1.5px solid var(--border); }
        .cancel-btn:hover { background: var(--border); }

        /* ===== 空状态 ===== */
        .empty-state { text-align: center; padding: 64px 20px; color: var(--text-muted); }

        /* ===== 图表 ===== */
        .chart-container {
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            height: 250px;
            padding: 20px 0;
            border-bottom: 2px solid var(--border);
        }
        .chart-bar { flex: 1; max-width: 80px; margin: 0 10px; display: flex; flex-direction: column; align-items: center; position: relative; }
        .chart-bar-value {
            background: var(--primary-grad);
            border-radius: var(--radius-sm) var(--radius-sm) 0 0;
            transition: height 0.3s ease;
            position: relative;
            min-width: 50px;
        }
        .chart-bar-value:hover { opacity: 0.82; }
        .chart-bar-label { margin-top: 10px; font-size: 12px; color: var(--text-secondary); text-align: center; font-weight: 600; }
        .chart-bar-count { position: absolute; top: -25px; left: 50%; transform: translateX(-50%); font-size: 14px; font-weight: 700; color: var(--primary); }
        .legend-item { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--text-secondary); }
        .legend-color { width: 14px; height: 14px; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>📋 新意念计划管理系统</h1>
            <p>
                多人实时协作 · 自动云端同步
                <span class="sync-status" id="syncStatus">
                    <span class="sync-dot"></span>
                    <span id="syncText">连接中...</span>
                </span>
            </p>
        </header>


        <div class="tabs">
            <button class="tab active" data-tab="weekly">周计划</button>
            <button class="tab" data-tab="monthly">月计划</button>
            <button class="tab" data-tab="completed">已完结计划</button>
            <button class="tab" data-tab="trash" style="color: #c62828;">🗑️ 回收站 <span id="trashCount" style="display:inline-block; background:#f44336; color:white; border-radius:10px; padding:1px 7px; font-size:12px; margin-left:4px; vertical-align:middle;">0</span></button>
        </div>

        <!-- 统计卡片 -->
        <div class="stats-container">
            <div class="stat-card">
                <div class="stat-icon">📊</div>
                <div class="stat-info">
                    <div class="stat-label">周计划</div>
                    <div class="stat-value" id="weeklyCount">0</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📈</div>
                <div class="stat-info">
                    <div class="stat-label">月计划</div>
                    <div class="stat-value" id="monthlyCount">0</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">✅</div>
                <div class="stat-info">
                    <div class="stat-label">已完结</div>
                    <div class="stat-value" id="completedCount">0</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📋</div>
                <div class="stat-info">
                    <div class="stat-label">总计</div>
                    <div class="stat-value" id="totalCount">0</div>
                </div>
            </div>
        </div>

        <div class="content-area">
            <div class="section-header">
                <h2 id="sectionTitle">周计划</h2>
                <button class="add-btn" id="addPlanBtn">+ 新增计划</button>
            </div>

            <!-- 全局搜索框 -->
            <div style="margin-bottom: 18px;">
                <div class="form-group" style="margin-bottom: 0;">
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <input type="text" id="searchInput" placeholder="🔍 搜索计划（立项名、工作内容、负责人、票型...）"
                               style="flex: 1; padding: 11px 16px; border: 1.5px solid var(--border); border-radius: 24px; font-size: 14px; background: var(--bg-subtle); color: var(--text-primary); outline: none; transition: border-color 0.2s, box-shadow 0.2s;"
                               onfocus="this.style.borderColor='var(--primary)';this.style.boxShadow='0 0 0 3px rgba(92,107,192,0.12)';this.style.background='white'"
                               onblur="this.style.borderColor='var(--border)';this.style.boxShadow='none';this.style.background='var(--bg-subtle)'">
                        <button id="clearSearchBtn" style="padding: 11px 20px; background: var(--bg-subtle); border: 1.5px solid var(--border); border-radius: 24px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--text-secondary); transition: all 0.2s;"
                            onmouseover="this.style.borderColor='var(--primary)';this.style.color='var(--primary)'"
                            onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--text-secondary)'">清空</button>
                    </div>
                </div>
                <div id="searchResults" style="margin-top: 10px; padding: 10px 16px; background: var(--primary-light); border-radius: 8px; display: none; border-left: 3px solid var(--primary);">
                    <span style="color: var(--primary-dark); font-weight: 600; font-size: 13px;">找到 <span id="searchCount">0</span> 个匹配计划</span>
                </div>
            </div>

            <!-- 状态筛选器（仅周计划显示） -->
            <div id="weeklyStatusFilter" style="display: none; margin-bottom: 25px; padding: 0;">
                <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 8px 18px; background: white; border-radius: 20px; border: 2px solid #9e9e9e; transition: all 0.2s ease; box-shadow: 0 1px 4px rgba(0,0,0,0.06); user-select: none;"
                        id="label-statusPending"
                        onmouseover="this.style.boxShadow='0 2px 8px rgba(0,0,0,0.12)'"
                        onmouseout="this.style.boxShadow='0 1px 4px rgba(0,0,0,0.06)'">
                        <span style="display:inline-block; width:10px; height:10px; border-radius:50%; background:#9e9e9e; flex-shrink:0;"></span>
                        <input type="checkbox" id="statusPending" checked style="display:none;">
                        <span style="font-size: 13px; font-weight: 600; color: #666; white-space:nowrap;">待开始</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 8px 18px; background: white; border-radius: 20px; border: 2px solid #4caf50; transition: all 0.2s ease; box-shadow: 0 1px 4px rgba(0,0,0,0.06); user-select: none;"
                        id="label-statusInProgress"
                        onmouseover="this.style.boxShadow='0 2px 8px rgba(0,0,0,0.12)'"
                        onmouseout="this.style.boxShadow='0 1px 4px rgba(0,0,0,0.06)'">
                        <span style="display:inline-block; width:10px; height:10px; border-radius:50%; background:#4caf50; flex-shrink:0;"></span>
                        <input type="checkbox" id="statusInProgress" checked style="display:none;">
                        <span style="font-size: 13px; font-weight: 600; color: #388e3c; white-space:nowrap;">进行中</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 8px 18px; background: white; border-radius: 20px; border: 2px solid #ff9800; transition: all 0.2s ease; box-shadow: 0 1px 4px rgba(0,0,0,0.06); user-select: none;"
                        id="label-statusPaused"
                        onmouseover="this.style.boxShadow='0 2px 8px rgba(0,0,0,0.12)'"
                        onmouseout="this.style.boxShadow='0 1px 4px rgba(0,0,0,0.06)'">
                        <span style="display:inline-block; width:10px; height:10px; border-radius:50%; background:#ff9800; flex-shrink:0;"></span>
                        <input type="checkbox" id="statusPaused" checked style="display:none;">
                        <span style="font-size: 13px; font-weight: 600; color: #e65100; white-space:nowrap;">间断中</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 8px 18px; background: white; border-radius: 20px; border: 2px solid #1976d2; transition: all 0.2s ease; box-shadow: 0 1px 4px rgba(0,0,0,0.06); user-select: none;"
                        id="label-showNextWeek"
                        onmouseover="this.style.boxShadow='0 2px 8px rgba(0,0,0,0.12)'"
                        onmouseout="this.style.boxShadow='0 1px 4px rgba(0,0,0,0.06)'">
                        <span style="display:inline-block; width:10px; height:10px; border-radius:50%; background:#1976d2; flex-shrink:0;"></span>
                        <input type="checkbox" id="showNextWeek" style="display:none;">
                        <span style="font-size: 13px; font-weight: 600; color: #1565c0; white-space:nowrap;">下周计划</span>
                    </label>
                </div>
            </div>

            <!-- 年份筛选器和图表按钮（仅已完结计划显示） -->
            <div id="yearFilter" style="display: none; margin-bottom: 20px; padding: 16px 20px; background: var(--bg-subtle); border-radius: var(--radius-md); border-left: 4px solid var(--primary); box-shadow: var(--shadow-sm);">
                <div style="display: flex; gap: 16px; align-items: center; flex-wrap: wrap;">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span style="font-size: 13px; font-weight: 700; color: var(--text-secondary);">📅 年份</span>
                        <select id="yearSelect" style="padding: 8px 12px; border-radius: var(--radius-xl); border: 1.5px solid var(--border); font-size: 13px; background: white; cursor: pointer; color: var(--text-primary); outline: none;">
                            <option value="">全部</option>
                        </select>
                    </div>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span style="font-size: 13px; font-weight: 700; color: var(--text-secondary);">📆 月份</span>
                        <select id="monthSelect" style="padding: 8px 12px; border-radius: var(--radius-xl); border: 1.5px solid var(--border); font-size: 13px; background: white; cursor: pointer; color: var(--text-primary); outline: none;">
                            <option value="">全部</option>
                            <option value="1">1月</option>
                            <option value="2">2月</option>
                            <option value="3">3月</option>
                            <option value="4">4月</option>
                            <option value="5">5月</option>
                            <option value="6">6月</option>
                            <option value="7">7月</option>
                            <option value="8">8月</option>
                            <option value="9">9月</option>
                            <option value="10">10月</option>
                            <option value="11">11月</option>
                            <option value="12">12月</option>

    <script type="module">

            weekly: '周计划',

            trash: '🗑️ 回收站'
        };

        window.onload = function() {
            console.log('页面加载完成');
            initSupabase();
            initTabs();
            initEventListeners();
        };

        function initSupabase() {
            var config = {
                url: 'https://cuvkfshykabvwnhrremb.supabase.co',
                key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN1dmtmc2h5a2FidnduaHJyZW1iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxMzIwNjksImV4cCI6MjA4ODcwODA2OX0.R3HDrqefIimS7HZsXoU1dZorB2jep-1LT5pc8O0tcP4'
            };

            console.log('检查 Supabase 库:', typeof supabaseCreateClient);

            if (typeof supabaseCreateClient === 'undefined') {
                console.error('Supabase 库未加载');
                setSyncStatus('error', '库加载失败');
                return;

            try {
                supabaseClient = supabaseCreateClient(config.url, config.key);
                console.log('Supabase 初始化成功');
                loadPlans();
                setupRealtime();
            } catch (error) {
                console.error('Supabase 初始化失败:', error);
                setSyncStatus('error', '连接失败');
            }
        }

        function setupRealtime() {
            if (!supabaseClient) return;

            // 设置5秒超时，如果订阅成功则显示已连接
            var timeoutId = setTimeout(function() {
                console.log('实时订阅超时，但数据已加载');
                setSyncStatus('connected', '已连接');
            }, 5000);

            supabaseClient.channel('plans-changes')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'plans' }, function(payload) {
                    console.log('收到实时更新:', payload);
                    loadPlans();
                })
                .subscribe(function(status, err) {
                    if (status === 'SUBSCRIBED') {
                        clearTimeout(timeoutId);
                        console.log('实时订阅成功');
                        setSyncStatus('connected', '已连接');
                    } else if (status === 'CLOSED') {
                        clearTimeout(timeoutId);
                        setSyncStatus('error', '连接断开');
                    } else if (status === 'CHANNEL_ERROR') {
                        clearTimeout(timeoutId);
                        console.error('频道错误:', err);
                        setSyncStatus('error', '连接错误');
                    } else {
                        console.log('订阅状态:', status);
                    }
                }, {
                    timeout: 5000
                });
        }

        function setSyncStatus(status, text) {
            var syncStatus = document.getElementById('syncStatus');
            var syncText = document.getElementById('syncText');
            syncStatus.className = 'sync-status ' + status;
            syncText.textContent = text;
        }

        function loadPlans() {
            if (!supabaseClient) return;

            setSyncStatus('syncing', '同步中...');

            supabaseClient.from('plans')
                .select('*')
                .order('created_at', { ascending: false })
                .then(function(result) {
                    var data = result.data;
                    var error = result.error;

                    if (error) {
                        console.error('加载数据失败:', error);
                        setSyncStatus('error', '同步失败');
                        return;
                    }

                    plans = data.map(function(plan) {
                        return {
                            id: plan.id,
                            type: plan.type,
                            title: plan.title,
                            titleBase: plan.title_base,
                            titleSuffix: plan.title_suffix,
                            content: plan.content,
                            workTicketNo: plan.work_ticket_no || '',
                            planNo: plan.plan_no || '',
                            startDate: plan.start_date,
                            endDate: plan.end_date,
                            ticketType: plan.ticket_type,
                            priority: plan.priority,
                            status: plan.status,
                            equipmentStatus: plan.equipment_status || '',
                            responsible: plan.responsible || '',
                            members: plan.members || '',
                            group1Leader: plan.group1_leader || '',
                            group1Members: plan.group1_members || '',
                            group2Leader: plan.group2_leader || '',
                            group2Members: plan.group2_members || '',
                            group3Leader: plan.group3_leader || '',
                            group3Members: plan.group3_members || '',
                            group4Leader: plan.group4_leader || '',
                            group4Members: plan.group4_members || '',
                            group5Leader: plan.group5_leader || '',
                            group5Members: plan.group5_members || '',
                            ticketPersonnel: plan.ticket_personnel || '',
                            fireWorkLeader: plan.fire_work_leader || '',
                            fireWorkExecutor: plan.fire_work_executor || '',
                            fireWorkGuardian: plan.fire_work_guardian || '',
                            isDeleted: plan.is_deleted || false,
                            deletedAt: plan.deleted_at || null,
                            isTransferred: plan.is_transferred || false,
                            transferredAt: plan.transferred_at || null,
                            createdAt: plan.created_at,
                            updatedAt: plan.updated_at
                        };
                    });

                    renderPlans();
                    updateStats();
                    setSyncStatus('connected', '已连接');
                    console.log('加载计划:', plans.length, '个');
                    // 每周一自动将下一周的月计划标记为已转移
                    autoTransferMonthlyPlans();
                    // 检查是否有计划已到结束时间，自动标记为已完成
                    autoCompleteExpiredPlans();
                });
        }

        // 自动将开始时间在下一周内的月计划标记为已转移（持久化到数据库，任何时候加载都检测）
        function autoTransferMonthlyPlans() {
            if (!supabaseClient) {
                console.warn('[转移] supabaseClient 未初始化，跳过');
                return;
            }

            var nextWeekRange = getNextWeekRange();
            console.log('[转移] 下一周范围:', nextWeekRange.start.toLocaleDateString(), '~', nextWeekRange.end.toLocaleDateString());
            console.log('[转移] 当前所有计划数量:', plans.length);

            // 找出开始时间在本周或下一周内、尚未标记转移的月计划
            var toTransfer = plans.filter(function(p) {
                var ok = p.type === 'monthly'
                    && !p.isDeleted
                    && !p.isTransferred
                    && p.status !== 'completed'
                    && p.startDate
                    && (isInCurrentWeek(p.startDate) || isInNextWeek(p.startDate));
                if (p.type === 'monthly') {
                    console.log('[转移] 月计划检查 -', p.title,
                        '| startDate:', p.startDate,
                        '| isDeleted:', p.isDeleted,
                        '| isTransferred:', p.isTransferred,
                        '| status:', p.status,
                        '| isInCurrentWeek:', isInCurrentWeek(p.startDate),
                        '| isInNextWeek:', isInNextWeek(p.startDate),
                        '| 符合转移:', ok);
                }
                return ok;
            });

            console.log('[转移] 符合转移条件的月计划数量:', toTransfer.length);

            if (toTransfer.length === 0) {
                console.log('[转移] 没有需要转移的月计划');
                return;
            }

            var now = new Date().toISOString();
            var ids = toTransfer.map(function(p) { return p.id; });
            console.log('[转移] 准备转移的计划IDs:', ids);

            supabaseClient.from('plans')
                .update({ is_transferred: true, transferred_at: now })
                .in('id', ids)
                .then(function(result) {
                    if (result.error) {
                        console.error('[转移] 数据库更新失败:', result.error);
                        return;
                    }
                    console.log('[转移] 数据库更新成功，已转移:', ids.length, '个');
                    // 更新本地数据，无需重新请求
                    plans.forEach(function(p) {
                        if (ids.indexOf(p.id) !== -1) {
                            p.isTransferred = true;
                            p.transferredAt = now;
                        }
                    });
                    renderPlans();
                    updateStats();
                });
        }

        // 自动检查结束时间已过的计划，将其状态更新为已完成
        function autoCompleteExpiredPlans() {
            if (!supabaseClient) return;

            var now = new Date();
            // 找出结束时间已过、状态不是已完成、也未被删除的计划
            var toComplete = plans.filter(function(p) {
                return !p.isDeleted
                    && p.status !== 'completed'
                    && p.endDate
                    && new Date(p.endDate) < now;
            });

            if (toComplete.length === 0) return;

            console.log('[自动完成] 发现', toComplete.length, '个已过期计划，准备自动标记为已完成');

            var nowIso = now.toISOString();
            var ids = toComplete.map(function(p) { return p.id; });

            supabaseClient.from('plans')
                .update({ status: 'completed', updated_at: nowIso })
                .in('id', ids)
                .then(function(result) {
                    if (result.error) {
                        console.error('[自动完成] 数据库更新失败:', result.error);
                        return;
                    }
                    console.log('[自动完成] 已自动完成:', toComplete.map(function(p){ return p.title; }).join('、'));
                    // 更新本地数据
                    plans.forEach(function(p) {
                        if (ids.indexOf(p.id) !== -1) {
                            p.status = 'completed';
                            p.updatedAt = nowIso;
                        }
                    });
                    renderPlans();
                    updateStats();
                });
        }

        // 每分钟检查一次是否有计划到期
        setInterval(function() {
            if (plans && plans.length > 0) {
                autoCompleteExpiredPlans();
            }
        }, 60 * 1000);

        function savePlanToCloud(planData) {
            if (!supabaseClient) {
                return Promise.reject(new Error('未连接到数据库'));
            }

            setSyncStatus('syncing', '保存中...');

            var dbData = {
                id: planData.id,
                type: planData.type,
                title: planData.title,
                title_base: planData.titleBase,
                title_suffix: planData.titleSuffix,
                content: planData.content,
                work_ticket_no: planData.workTicketNo || null,
                plan_no: planData.planNo || null,
                start_date: planData.startDate,
                end_date: planData.endDate,
                ticket_type: planData.ticketType,
                priority: planData.priority,
                status: planData.status,
                equipment_status: planData.equipmentStatus,
                responsible: planData.responsible,
                members: planData.members,
                group1_leader: planData.group1Leader,
                group1_members: planData.group1Members,
                group2_leader: planData.group2Leader,
                group2_members: planData.group2Members,
                group3_leader: planData.group3Leader,
                group3_members: planData.group3Members,
                group4_leader: planData.group4Leader,
                group4_members: planData.group4Members,
                group5_leader: planData.group5Leader,
                group5_members: planData.group5Members,
                ticket_personnel: planData.ticketPersonnel,
                fire_work_leader: planData.fireWorkLeader,
                fire_work_executor: planData.fireWorkExecutor,
                fire_work_guardian: planData.fireWorkGuardian,
                is_transferred: planData.isTransferred || false,
                transferred_at: planData.transferredAt || null
            };

            return supabaseClient.from('plans')
                .upsert(dbData)
                .select()
                .single()
                .then(function(result) {
                    if (result.error) {
                        throw result.error;
                    }
                    return result.data;
                });
        }

        function deletePlanFromCloud(planId) {
            if (!supabaseClient) {
                return Promise.reject(new Error('未连接到数据库'));
            }

            // 软删除：将计划标记为已删除，移入回收站
            return supabaseClient.from('plans')
                .update({ is_deleted: true, deleted_at: new Date().toISOString() })
                .eq('id', planId)
                .then(function(result) {
                    if (result.error) {
                        throw result.error;
                    }
                });
        }

            if (!supabaseClient) {

        function permanentDeletePlan(planId) {

                .delete()
                .eq('id', planId)

                });

        function openModal(planId) {
            var modal = document.getElementById('planModal');
            var form = document.getElementById('planForm');
            var title = document.getElementById('modalTitle');

            form.reset();
            editingPlanId = planId;

            if (planId) {
                var plan = plans.find(function(p) { return p.id === planId; });
                // 如果没找到（比如是周计划中的来自月计划的记录），尝试查找原始月计划
                if (!plan && planId && planId.endsWith('_weekly')) {
                    var sourceId = planId.replace('_weekly', '');
                    plan = plans.find(function(p) { return p.id === sourceId; });
                    // 如果找到原始月计划，设置编辑ID为原始ID
                    if (plan) {
                        editingPlanId = sourceId;
                    }
                }
                if (plan) {
                    title.textContent = '编辑计划';
                    document.getElementById('planId').value = plan.id;
                    document.getElementById('planType').value = plan.type;

                    // 填充标题（如果是新的格式，拆分标题和补充说明；旧格式兼容）
                    if (plan.titleBase) {
                        document.getElementById('planTitle').value = plan.titleBase;
                        document.getElementById('planTitleSuffix').value = plan.titleSuffix || '';
                    } else {
                        // 旧数据，尝试从标题中提取补充说明
                        var match = plan.title.match(/^(.+?)\s*-\s*(.+)$/);
                        if (match) {
                            document.getElementById('planTitle').value = match[1];
                            document.getElementById('planTitleSuffix').value = match[2];
                        } else {
                            document.getElementById('planTitle').value = plan.title;
                            document.getElementById('planTitleSuffix').value = '';
                        }
                    }

                    document.getElementById('planContent').value = plan.content;
                    document.getElementById('workTicketNo').value = plan.workTicketNo || '';
                    document.getElementById('planNo').value = plan.planNo || '';

                    // 填充开始时间
                    var startDateTime = new Date(plan.startDate);
                    document.getElementById('startDate').value = formatDateForInput(startDateTime);
                    document.getElementById('startHour').value = startDateTime.getHours();
                    document.getElementById('startMinute').value = String(startDateTime.getMinutes()).padStart(2, '0');

                    // 填充结束时间
                    var endDateTime = new Date(plan.endDate);
                    document.getElementById('endDate').value = formatDateForInput(endDateTime);
                    document.getElementById('endHour').value = endDateTime.getHours();
                    document.getElementById('endMinute').value = String(endDateTime.getMinutes()).padStart(2, '0');

                    document.getElementById('ticketType').value = plan.ticketType || '';
                    document.getElementById('priority').value = plan.priority;
                    document.getElementById('status').value = plan.status;
                    document.getElementById('equipmentStatus').value = plan.equipmentStatus || '';

                    // 只在周计划和月计划时填充人员信息
                    if (plan.type === 'weekly' || plan.type === 'monthly') {
                        document.getElementById('responsible').value = plan.responsible || '';
                        document.getElementById('members').value = plan.members || '';
                        document.getElementById('group1Leader').value = plan.group1Leader || '';
                        document.getElementById('group1Members').value = plan.group1Members || '';
                        document.getElementById('group2Leader').value = plan.group2Leader || '';
                        document.getElementById('group2Members').value = plan.group2Members || '';
                        document.getElementById('group3Leader').value = plan.group3Leader || '';
                        document.getElementById('group3Members').value = plan.group3Members || '';
                        document.getElementById('group4Leader').value = plan.group4Leader || '';
                        document.getElementById('group4Members').value = plan.group4Members || '';
                        document.getElementById('group5Leader').value = plan.group5Leader || '';
                        document.getElementById('group5Members').value = plan.group5Members || '';

                        // 填充办票人员信息

                        document.getElementById('fireWorkGuardian').value = plan.fireWorkGuardian || '';
                    }
                }
            } else {
                title.textContent = '新增计划';
                document.getElementById('planType').value = currentTab;
            }

            // 根据计划类型显示/隐藏人员字段
            togglePersonnelFields(document.getElementById('planType').value);

        function updateStats() {
            var activePlans = plans.filter(function(p) { return !p.isDeleted; });
            var weeklyCount = activePlans.filter(function(p) {
                // 周计划本身 + 已转移到周计划的月计划，均计入周计划统计
                return (p.type === 'weekly' || (p.type === 'monthly' && p.isTransferred))
                    && p.status !== 'completed';
            }).length;
            // 月计划统计：排除已转移到周计划的计划
            var monthlyCount = activePlans.filter(function(p) {
                return p.type === 'monthly'
                    && p.status !== 'completed'
                    && !p.isTransferred;
            }).length;
            var completedCount = activePlans.filter(function(p) { return p.status === 'completed'; }).length;
            var totalCount = activePlans.length;
            var trashCount = plans.filter(function(p) { return p.isDeleted; }).length;

            document.getElementById('weeklyCount').textContent = weeklyCount;
            document.getElementById('monthlyCount').textContent = monthlyCount;
            document.getElementById('completedCount').textContent = completedCount;
            document.getElementById('totalCount').textContent = totalCount;

            var trashBadge = document.getElementById('trashCount');
            if (trashBadge) {
                trashBadge.textContent = trashCount;
                trashBadge.style.display = trashCount > 0 ? 'inline-block' : 'none';
            }
        }

            var planData = {
                id: editingPlanId || String(Date.now()),
                type: document.getElementById('planType').value,

                planNo: document.getElementById('planNo').value,

                equipmentStatus: document.getElementById('equipmentStatus').value,
                responsible: document.getElementById('responsible').value,
                members: document.getElementById('members').value,
                group1Leader: document.getElementById('group1Leader').value,
                group1Members: document.getElementById('group1Members').value,
                group2Leader: document.getElementById('group2Leader').value,
                group2Members: document.getElementById('group2Members').value,
                group3Leader: document.getElementById('group3Leader').value,
                group3Members: document.getElementById('group3Members').value,

                        group5Leader: document.getElementById('group5Leader').value,

            savePlanToCloud(planData)

            var newCancelBtn = cancelBtn.cloneNode(true);
            confirmBtn.parentNode.replaceChild(newConfirmBtn, confirmBtn);
            cancelBtn.parentNode.replaceChild(newCancelBtn, cancelBtn);

            newCancelBtn.addEventListener('click', function() {
                modal.style.display = 'none';

        function renderPlans() {
            var container = document.getElementById('planList');
            var filteredPlans;

            // 获取搜索关键词
            var searchKeyword = document.getElementById('searchInput').value.toLowerCase().trim();
            var searchResultsDiv = document.getElementById('searchResults');

            // 回收站标签：显示已删除的计划
            if (currentTab === 'trash') {
                filteredPlans = plans.filter(function(p) { return p.isDeleted; });

                // 搜索过滤

            var texts = {
                pending: '<span style="background: #9e9e9e; color: white; padding: 4px 11px; border-radius: 8px; font-size: 12px; font-weight: 600; border: 1px solid #757575;">待开始</span>',
                'in-progress': '<span style="background: #4caf50; color: white; padding: 4px 11px; border-radius: 8px; font-size: 12px; font-weight: 600; border: 1px solid #388e3c;">进行中</span>',
                paused: '<span style="background: #ff9800; color: white; padding: 4px 11px; border-radius: 8px; font-size: 12px; font-weight: 600; border: 1px solid #f57c00;">间断中</span>',
                completed: '<span style="background: #2196f3; color: white; padding: 4px 11px; border-radius: 8px; font-size: 12px; font-weight: 600; border: 1px solid #1565c0;">已完成</span>'
            };
            return texts[status] || '<span style="background: #9e9e9e; color: white; padding: 4px 11px; border-radius: 8px; font-size: 12px; border: 1px solid #757575;">未知</span>';
        }

        function getEquipmentStatusText(status) {
            var texts = {
                'none': '<span style="background: #9e9e9e; color: white; padding: 4px 11px; border-radius: 8px; font-size: 12px; font-weight: 600; border: 1px solid #757575;">无设备</span>',
                'not-arrived': '<span style="background: #ff5722; color: white; padding: 4px 11px; border-radius: 8px; font-size: 12px; font-weight: 600; border: 1px solid #d84315;">未到货</span>',
                'pending': '<span style="background: #ff9800; color: white; padding: 4px 11px; border-radius: 8px; font-size: 12px; font-weight: 600; border: 1px solid #f57c00;">待试验</span>',
                'testing': '<span style="background: #2196f3; color: white; padding: 4px 11px; border-radius: 8px; font-size: 12px; font-weight: 600; border: 1px solid #1565c0;">试验中</span>',
                'tested': '<span style="background: #4caf50; color: white; padding: 4px 11px; border-radius: 8px; font-size: 12px; font-weight: 600; border: 1px solid #388e3c;">已试验</span>'
            };
            return texts[status] || '<span style="background: #9e9e9e; color: white; padding: 4px 11px; border-radius: 8px; font-size: 12px; border: 1px solid #757575;">未知</span>';
        }

        function escapeHtml(text) {
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 格式化日期为 date 输入框需要的格式 (YYYY-MM-DD)
        function formatDateForInput(date) {
            if (!date) return '';
            var year = date.getFullYear();
            var month = String(date.getMonth() + 1).padStart(2, '0');
            var day = String(date.getDate()).padStart(2, '0');
            return year + '-' + month + '-' + day;
        }

        // 格式化日期时间为 datetime-local 输入框需要的格式 (YYYY-MM-DDTHH:mm)
        function formatDateTimeForInput(dateTimeStr) {
            if (!dateTimeStr) return '';
            var date = new Date(dateTimeStr);
            var year = date.getFullYear();
            var month = String(date.getMonth() + 1).padStart(2, '0');
            var day = String(date.getDate()).padStart(2, '0');
            var hours = String(date.getHours()).padStart(2, '0');
            var minutes = String(date.getMinutes()).padStart(2, '0');
            return year + '-' + month + '-' + day + 'T' + hours + ':' + minutes;
        }

        // 格式化日期时间用于显示
        function formatDateTimeForDisplay(dateTimeStr) {
            if (!dateTimeStr) return '';
            var date = new Date(dateTimeStr);
            var year = date.getFullYear();
            var month = String(date.getMonth() + 1).padStart(2, '0');
            var day = String(date.getDate()).padStart(2, '0');
            var hours = String(date.getHours()).padStart(2, '0');
            var minutes = String(date.getMinutes()).padStart(2, '0');
            return year + '-' + month + '-' + day + ' ' + hours + ':' + minutes;
        }

        // 获取当前周的起始和结束日期
        function getCurrentWeekRange() {
            var now = new Date();
            var day = now.getDay();
            var monday = new Date(now);
            monday.setDate(now.getDate() - (day === 0 ? 6 : day - 1));
            monday.setHours(0, 0, 0, 0);

            var sunday = new Date(monday);
            sunday.setDate(monday.getDate() + 6);
            sunday.setHours(23, 59, 59, 999);

            return { start: monday, end: sunday };
        }

        // 获取下一周的起始和结束日期
        function getNextWeekRange() {
            var now = new Date();
            var day = now.getDay();
            var thisMonday = new Date(now);
            thisMonday.setDate(now.getDate() - (day === 0 ? 6 : day - 1));
            thisMonday.setHours(0, 0, 0, 0);

            // 下周一 = 本周一 + 7天
            var nextMonday = new Date(thisMonday);
            nextMonday.setDate(thisMonday.getDate() + 7);

            // 下周日 = 下周一 + 6天
            var nextSunday = new Date(nextMonday);
            nextSunday.setDate(nextMonday.getDate() + 6);
            nextSunday.setHours(23, 59, 59, 999);

            return { start: nextMonday, end: nextSunday };
        }

        // 将 "YYYY-MM-DD" 格式的日期字符串解析为本地时间的 Date 对象（避免UTC时区偏移）
        function parseLocalDate(dateStr) {
            if (!dateStr) return null;
            // 取前10位 "YYYY-MM-DD"，按本地时间解析
            var parts = dateStr.substring(0, 10).split('-');
            return new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]), 0, 0, 0, 0);
        }

        // 检查日期是否在当前周内
        function isInCurrentWeek(dateStr) {
            var weekRange = getCurrentWeekRange();
            var date = parseLocalDate(dateStr);
            if (!date) return false;
            return date >= weekRange.start && date <= weekRange.end;
        }

        // 检查日期是否在下一周内
        function isInNextWeek(dateStr) {
            var weekRange = getNextWeekRange();
            var date = parseLocalDate(dateStr);
            if (!date) return false;
            return date >= weekRange.start && date <= weekRange.end;
        }

        // 检查今天是否是周一
        function isTodayMonday() {
            return new Date().getDay() === 1;
        }

        // 检查今天是否是周二
        function isTodayTuesday() {
            var now = new Date();
            var dayOfWeek = now.getDay();
            return dayOfWeek === 2;
        }

        // 更新年份筛选器
        function updateYearFilter() {
            var yearSelect = document.getElementById('yearSelect');
            var completedPlans = plans.filter(function(p) { return p.status === 'completed'; });
            var years = [];

            completedPlans.forEach(function(plan) {
                var year = new Date(plan.endDate).getFullYear();
                if (years.indexOf(year) === -1) {
                    years.push(year);
                }
            });

            years.sort(function(a, b) { return b - a; }); // 降序排列

            yearSelect.innerHTML = '<option value="">全部年份</option>';
            years.forEach(function(year) {
                yearSelect.innerHTML += '<option value="' + year + '">' + year + '年</option>';
            });
        }

        // 渲染柱状图
        function renderChart() {
            var chartCanvas = document.getElementById('chartCanvas');
            var chartLegend = document.getElementById('chartLegend');

            var selectedYear = document.getElementById('yearSelect').value;
            var completedPlans = plans.filter(function(p) {
                if (p.status !== 'completed') return false;
                if (selectedYear && selectedYear !== '') {
                    var planYear = new Date(p.endDate).getFullYear();
                    return planYear === parseInt(selectedYear);
                }
                return true;
            });

            // 按立项名分组统计
            var projectStats = {};
            completedPlans.forEach(function(plan) {
                var titleBase = plan.titleBase || plan.title;
                if (!projectStats[titleBase]) {
                    projectStats[titleBase] = 0;
                }
                projectStats[titleBase]++;
            });

            var projects = Object.keys(projectStats);
            var counts = Object.values(projectStats);
            var maxCount = Math.max.apply(null, counts) || 1;

            // 颜色数组
            var colors = [
                '#667eea', '#764ba2', '#f093fb', '#f5576c',
                '#4facfe', '#00f2fe', '#43e97b', '#38f9d7',
                '#fa709a', '#fee140'
            ];

            // 生成柱状图HTML
            var chartHtml = '<div class="chart-container">';
            projects.forEach(function(project, index) {
                var count = projectStats[project];
                var height = (count / maxCount) * 200; // 最大高度200px
                var color = colors[index % colors.length];

                chartHtml += '<div class="chart-bar">' +
                    '<div class="chart-bar-count">' + count + '</div>' +
                    '<div class="chart-bar-value" style="height: ' + height + 'px; background: ' + color + ';"></div>' +
                    '<div class="chart-bar-label">' + project + '</div>' +
                    '</div>';
            });
            chartHtml += '</div>';

            chartCanvas.innerHTML = chartHtml;

            // 生成图例
            var legendHtml = '';
            projects.forEach(function(project, index) {
                var color = colors[index % colors.length];
                var count = projectStats[project];
                legendHtml += '<div class="legend-item">' +
                    '<div class="legend-color" style="background: ' + color + ';"></div>' +
                    '<span>' + project + ': ' + count + '个</span>' +
                    '</div>';
            });
            chartLegend.innerHTML = legendHtml;
        }

        // 暴露函数到全局作用域，供 HTML onclick 使用
        window.openModal = openModal;
        window.deletePlan = deletePlan;
        window.restorePlan = restorePlan;
        window.permanentDelete = permanentDelete;

        console.log('JavaScript 加载完成');
    </script>
</body>
