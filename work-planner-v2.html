<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新意念计划管理系统 - 云端版</title>
    <style>
        /* ===== 设计令牌 ===== */
        :root {
            --primary:       #4f6ef2;
            --primary-dark:  #3451d1;
            --primary-light: #eef1fd;
            --primary-grad:  linear-gradient(135deg, #4f6ef2 0%, #7c52e8 100%);

            --success: #10b981;
            --warning: #f59e0b;
            --danger:  #ef4444;
            --info:    #3b82f6;
            --gray:    #6b7280;

            --bg-body:   #f0f2f8;
            --bg-card:   #ffffff;
            --bg-subtle: #f8f9fc;

            --border:    #e5e7ef;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;

            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.04);
            --shadow-lg: 0 10px 30px rgba(0,0,0,0.10), 0 4px 8px rgba(0,0,0,0.06);

            --text-primary:   #111827;
            --text-secondary: #4b5563;
            --text-muted:     #9ca3af;

            --font: 'Microsoft YaHei', 'PingFang SC', 'Segoe UI', Arial, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font);
            background: var(--bg-body);
            min-height: 100vh;
            padding: 24px 20px 40px;
            color: var(--text-primary);
        }

        .container { max-width: 1400px; margin: 0 auto; }

        /* ===== Header ===== */
        .header {
            background: linear-gradient(135deg, #4f6ef2 0%, #7c52e8 100%);
            padding: 22px 32px;
            border-radius: var(--radius-lg);
            box-shadow: 0 8px 24px rgba(79,110,242,0.30);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            position: relative;
            overflow: hidden;
        }
        .header::before {
            content: '';
            position: absolute;
            top: -40px; right: -40px;
            width: 160px; height: 160px;
            border-radius: 50%;
            background: rgba(255,255,255,0.07);
            pointer-events: none;
        }
        .header::after {
            content: '';
            position: absolute;
            bottom: -30px; left: 20%;
            width: 100px; height: 100px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            pointer-events: none;
        }

        .header h1 {
            color: #fff;
            font-size: 1.55em;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .header p {
            color: rgba(255,255,255,0.85);
            font-size: 0.9em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* ===== 同步状态 ===== */
        .sync-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            background: rgba(255,255,255,0.18);
            border-radius: 20px;
            font-size: 12px;
            color: #fff;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.25);
            backdrop-filter: blur(4px);
        }
        .sync-status.syncing { background: rgba(245,158,11,0.25); border-color: rgba(245,158,11,0.4); }
        .sync-status.error   { background: rgba(239,68,68,0.25);  border-color: rgba(239,68,68,0.4); }

        .sync-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: #4ade80;
            animation: pulse 2s infinite;
        }
        .sync-status.syncing .sync-dot { background: #fbbf24; animation: pulse 0.5s infinite; }
        .sync-status.error   .sync-dot { background: #f87171; animation: none; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.35; }
        }

        /* ===== Tabs ===== */
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 18px;
            background: var(--bg-card);
            padding: 6px;
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-sm);
            flex-wrap: wrap;
            border: 1px solid var(--border);
        }

        .tab {
            padding: 9px 22px;
            background: transparent;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13.5px;
            font-weight: 600;
            color: var(--text-secondary);
            transition: all 0.2s ease;
            letter-spacing: 0.2px;
            white-space: nowrap;
        }
        .tab:hover {
            background: var(--primary-light);
            color: var(--primary);
        }
        .tab.active {
            background: var(--primary-grad);
            color: white;
            box-shadow: 0 3px 10px rgba(79,110,242,0.35);
        }

        /* ===== 统计卡片 ===== */
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px;
            margin-bottom: 18px;
        }

        .stat-card {
            background: var(--bg-card);
            padding: 18px 20px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            gap: 16px;
            transition: box-shadow 0.2s, transform 0.2s;
            border: 1px solid var(--border);
        }
        .stat-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }

        .stat-icon {
            font-size: 1.6em;
            width: 48px; height: 48px;
            display: flex; align-items: center; justify-content: center;
            border-radius: var(--radius-md);
            flex-shrink: 0;
        }
        .stat-card:nth-child(1) .stat-icon { background: #eef1fd; }
        .stat-card:nth-child(2) .stat-icon { background: #eff6ff; }
        .stat-card:nth-child(3) .stat-icon { background: #ecfdf5; }
        .stat-card:nth-child(4) .stat-icon { background: #f9fafb; }

        .stat-info { flex: 1; }
        .stat-label { color: var(--text-muted); font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 4px; }
        .stat-value { color: var(--text-primary); font-size: 2em; font-weight: 800; line-height: 1; letter-spacing: -0.5px; }

        /* ===== 内容区 ===== */
        .content-area {
            background: var(--bg-card);
            padding: 24px 28px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            min-height: clamp(300px, 60vh, 600px);
            border: 1px solid var(--border);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1.5px solid var(--border);
        }

        .section-header h2 {
            color: var(--text-primary);
            font-size: 1.3em;
            font-weight: 700;
        }

        /* ===== 按钮 ===== */
        .add-btn {
            padding: 9px 20px;
            background: var(--primary-grad);
            color: white;
            border: none;
            border-radius: var(--radius-xl);
            cursor: pointer;
            font-size: 13.5px;
            font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(79,110,242,0.30);
            letter-spacing: 0.2px;
        }
        .add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(79,110,242,0.42);
        }

        /* ===== 计划列表 ===== */
        .plan-list { display: flex; flex-direction: column; gap: 10px; }

        .plan-card {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            padding: 18px 20px;
            transition: box-shadow 0.2s, transform 0.2s;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            border-left: 4px solid var(--primary);
            position: relative;
            min-width: 0;
            overflow: hidden;
        }

        .plan-card.urgent {
            background: linear-gradient(160deg, #fff5f5 0%, #fff 80%);
            border-left-color: var(--danger);
            box-shadow: 0 2px 10px rgba(239,68,68,0.10);
        }
        .plan-card.urgent .plan-title { color: var(--danger); }

        .plan-card.near {
            background: linear-gradient(160deg, #fffbeb 0%, #fff 80%);
            border-left-color: var(--warning);
            box-shadow: 0 2px 10px rgba(245,158,11,0.10);
        }

        .plan-card.normal {
            background: linear-gradient(160deg, #f0fdf4 0%, #fff 80%);
            border-left-color: var(--success);
        }

        .plan-card.far {
            background: var(--bg-subtle);
            border-left-color: #d1d5db;
            opacity: 0.88;
        }

        .plan-card.from-monthly { }

        .plan-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .plan-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 12px;
        }

        .plan-title {
            font-size: 1.05em;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
            letter-spacing: 0.2px;
            line-height: 1.4;
        }

        .plan-meta {
            display: flex;
            gap: 8px;
            color: var(--text-secondary);
            font-size: 12.5px;
            align-items: center;
            flex-wrap: wrap;
            min-width: 0;
        }

        .plan-actions { display: flex; gap: 7px; flex-shrink: 0; margin-left: 12px; }

        .action-btn {
            padding: 6px 16px;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 12.5px;
            font-weight: 600;
            transition: all 0.15s ease;
            letter-spacing: 0.2px;
            white-space: nowrap;
            min-width: 52px;
            text-align: center;
            line-height: 1.4;
        }
        .edit-btn   { background: #fff7ed; color: #c2410c; border: 1px solid #fed7aa; }
        .delete-btn { background: #fff1f2; color: #be123c; border: 1px solid #fecdd3; }
        .action-btn:hover { filter: brightness(0.93); transform: translateY(-1px); box-shadow: var(--shadow-sm); }

        /* ===== 弹窗 ===== */
        .modal {
            display: none;
            position: fixed;
            z-index: 99999;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background: rgba(17,24,39,0.50);
            backdrop-filter: blur(3px);
        }
        .modal.show { display: flex; justify-content: center; align-items: flex-start; padding: 24px 12px; }

        .modal-content {
            background: var(--bg-card);
            padding: 28px 32px 24px;
            border-radius: var(--radius-lg);
            width: 90%;
            max-width: 700px;
            max-height: calc(100vh - 48px);
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            box-shadow: 0 20px 60px rgba(17,24,39,0.25);
            border: 1px solid var(--border);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            padding-bottom: 14px;
            border-bottom: 1.5px solid var(--border);
        }
        .modal-header h3 { color: var(--text-primary); font-size: 1.25em; font-weight: 700; }

        .close-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-muted); transition: color 0.2s; line-height: 1; }
        .close-btn:hover { color: var(--text-primary); }

        /* ===== 表单 ===== */
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 12.5px;
            letter-spacing: 0.3px;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px 13px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 13.5px;
            box-sizing: border-box;
            color: var(--text-primary);
            background: var(--bg-subtle);
            transition: border-color 0.2s, box-shadow 0.2s;
            user-select: text;
            -webkit-user-select: text;
            font-family: var(--font);
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 3px rgba(79,110,242,0.10);
        }
        .form-group textarea { resize: vertical; min-height: 88px; }

        .form-row { display: flex; gap: 14px; }
        .form-row .form-group { flex: 1; }

        /* 时间输入行：日期 + 时 + 分 */
        .time-row {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: nowrap;
        }
        .time-row .time-date {
            flex: 1;
            min-width: 0;
        }
        .time-row .time-hm {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-shrink: 0;
        }
        .time-row .time-hm input {
            width: 56px !important;
            padding: 10px 6px !important;
            text-align: center;
        }
        .time-colon {
            font-weight: 700;
            color: #666;
            line-height: 1;
            flex-shrink: 0;
        }
        /* 时间行容器（含label）：手机端两个时间 form-group 各占全宽 */
        .time-form-row {
            display: flex;
            gap: 14px;
        }
        .time-form-row .form-group {
            flex: 1;
            min-width: 0;
        }

        /* 人员信息分区 */
        .personnel-section {
            margin-top: 22px;
            padding-top: 18px;
            border-top: 2px solid var(--border);
        }
        .section-title {
            margin-bottom: 16px;
            font-size: 15px;
            font-weight: 700;
            color: var(--primary);
        }
        .sub-section-title {
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
        }
        .sub-divider {
            margin-top: 18px;
            padding-top: 14px;
            border-top: 1.5px dashed var(--border);
        }

        /* 小组卡片容器（桌面无额外样式，移动端加背景卡片） */
        .group-card {
            border-radius: var(--radius-sm);
        }
        .group-card + .group-card {
            margin-top: 6px;
        }
        /* 小组序号标记 */
        .group-no {
            display: none; /* 桌面不显示，移动端显示 */
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
            padding: 2px 8px;
            background: var(--bg-subtle);
            border-radius: 4px;
            width: fit-content;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 22px;
        }
        .modal-actions button {
            flex: 1;
            padding: 11px;
            border: none;
            border-radius: var(--radius-md);
            font-size: 13.5px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: var(--font);
        }
        .save-btn {
            background: var(--primary-grad);
            color: white;
            box-shadow: 0 2px 8px rgba(79,110,242,0.30);
        }
        .save-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(79,110,242,0.40); }
        .cancel-btn { background: var(--bg-subtle); color: var(--text-secondary); border: 1.5px solid var(--border); }
        .cancel-btn:hover { background: var(--border); }

        /* ===== 空状态 ===== */
        .empty-state { text-align: center; padding: 64px 20px; color: var(--text-muted); }

        /* ===== 图表 ===== */
        .chart-container {
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            min-height: 260px;
            padding: 36px 8px 0;
            border-bottom: 1.5px solid var(--border);
            overflow-x: auto;
        }
        .chart-bar {
            flex: 1;
            min-width: 60px;
            max-width: 100px;
            margin: 0 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        .chart-bar-value {
            background: var(--primary-grad);
            border-radius: var(--radius-sm) var(--radius-sm) 0 0;
            transition: height 0.4s ease;
            width: 100%;
            min-height: 4px;
            position: relative;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }
        .chart-bar-value:hover { opacity: 0.80; }
        .chart-bar-count {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            margin-bottom: 5px;
            font-size: 13px;
            font-weight: 700;
            color: var(--primary);
            white-space: nowrap;
            background: var(--bg-card);
            padding: 1px 6px;
            border-radius: 6px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }
        .chart-bar-label {
            margin-top: 10px;
            font-size: 11px;
            color: var(--text-secondary);
            text-align: center;
            font-weight: 600;
            max-width: 90px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            cursor: default;
            padding-bottom: 8px;
        }
        .legend-item { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--text-secondary); }
        .legend-color { width: 14px; height: 14px; border-radius: 4px; flex-shrink: 0; }

        /* ===== 通用标签/徽章 ===== */
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 11.5px;
            font-weight: 600;
            border: 1px solid transparent;
            white-space: nowrap;
            line-height: 1.6;
        }
        .badge-sm { font-size: 11px; padding: 2px 7px; }
        .badge-date   { background: var(--primary-light); color: var(--primary-dark); border-color: #c7d2fe; padding: 4px 10px; font-size: 12px; }
        .badge-urgent { background: #fef2f2; color: #dc2626; border-color: #fecaca; font-weight: 700; }
        .badge-warn3  { background: #fff7ed; color: #ea580c; border-color: #fed7aa; font-weight: 700; }
        .badge-warn7  { background: #fffbeb; color: #d97706; border-color: #fde68a; }
        .badge-far    { background: #f9fafb; color: #6b7280; border-color: #e5e7eb; font-weight: 400; }
        .badge-next   { background: #eff6ff; color: #2563eb; border-color: #bfdbfe; }
        .badge-ticket { background: var(--primary-light); color: var(--primary-dark); border-color: #c7d2fe; }
        .badge-work-no { background: #f0fdf4; color: #15803d; border-color: #bbf7d0; }
        .badge-plan-no { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
        .badge-person  { background: #fff7ed; color: #c2410c; border-color: #fed7aa; font-size: 13px; padding: 4px 11px; white-space: normal; word-break: break-all; overflow-wrap: anywhere; }
        .badge-members { background: #faf5ff; color: #7c3aed; border-color: #ddd6fe; font-size: 13px; padding: 4px 11px; white-space: normal; word-break: break-all; overflow-wrap: anywhere; }
        .badge-trash   { background: #eeeeee; color: #9e9e9e; border-color: #e0e0e0; font-size: 11px; }
        .badge-trash-date { background: #eeeeee; color: #757575; border-color: #e0e0e0; padding: 4px 10px; font-size: 12px; }

        /* ===== 搜索框 ===== */
        .search-wrap { margin-bottom: 16px; }
        .search-inner { display: flex; gap: 8px; align-items: center; }
        .search-input {
            flex: 1;
            padding: 10px 16px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-xl);
            font-size: 13.5px;
            background: var(--bg-subtle);
            color: var(--text-primary);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
            font-family: var(--font);
        }
        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79,110,242,0.10);
            background: white;
        }
        .search-clear {
            padding: 10px 18px;
            background: var(--bg-subtle);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-xl);
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            transition: all 0.2s;
            white-space: nowrap;
            font-family: var(--font);
        }
        .search-clear:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-light);
        }

        /* ===== 状态筛选器 ===== */
        .status-filter { display: none; margin-bottom: 20px; }
        .filter-label {
            display: flex;
            align-items: center;
            gap: 7px;
            cursor: pointer;
            padding: 7px 16px;
            background: white;
            border-radius: var(--radius-xl);
            border: 1.5px solid #d1d5db;
            transition: border-color 0.2s, box-shadow 0.2s;
            box-shadow: var(--shadow-sm);
            user-select: none;
        }
        .filter-label:hover { box-shadow: var(--shadow-md); }
        .filter-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .filter-text { font-size: 13px; font-weight: 600; white-space: nowrap; }

        /* 小组信息卡片 */
        .group-block {
            margin-top: 10px;
            padding: 12px 14px;
            background: var(--bg-subtle);
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            min-width: 0;
            overflow: hidden;
        }
        .group-item {
            padding: 10px 12px;
            background: white;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            min-width: 0;
            overflow: hidden;
        }
        .group-item + .group-item { margin-top: 8px; }
        .group-label { font-size: 12px; font-weight: 700; color: var(--primary); margin-bottom: 5px; }
        .group-row {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 3px;
            word-break: break-all;
            overflow-wrap: anywhere;
            line-height: 1.5;
        }
        .group-row:last-child { margin-bottom: 0; }
        .group-val {
            color: var(--text-primary);
            font-weight: 600;
            word-break: break-all;
            overflow-wrap: anywhere;
        }

        /* 动火作业信息块 */
        .firework-block {
            margin-top: 10px;
            padding: 11px 14px;
            background: #fff7f7;
            border-radius: var(--radius-md);
            border: 1px solid #fecdd3;
            border-left: 3px solid #ef4444;
            min-width: 0;
            overflow: hidden;
        }
        .firework-title { font-size: 12px; font-weight: 700; color: #ef4444; margin-bottom: 6px; }
        .firework-row {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 3px;
            word-break: break-all;
            overflow-wrap: anywhere;
            line-height: 1.5;
        }
        .firework-row:last-child { margin-bottom: 0; }

        /* 办票人员块 */
        .ticket-person-block {
            margin-top: 10px;
            padding: 10px 14px;
            background: #fdf4ff;
            border-radius: var(--radius-md);
            border: 1px solid #e9d5ff;
            border-left: 3px solid #9333ea;
            font-size: 13px;
            word-break: break-all;
            overflow-wrap: anywhere;
            min-width: 0;
            overflow: hidden;
        }

        /* 卡片内容文本区 */
        .card-content {
            margin-top: 12px;
            padding: 14px 16px;
            background: var(--bg-subtle);
            border-radius: var(--radius-md);
            border-left: 3px solid var(--warning);
            color: var(--text-secondary);
            line-height: 1.75;
            font-size: 14px;
            word-break: break-all;
            overflow-wrap: anywhere;
            min-width: 0;
            overflow: hidden;
        }

        /* ===== 滚动条美化（桌面端） ===== */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }

        /* ===== 输入框统一过渡 ===== */
        html { overscroll-behavior-y: none; }
        body { overscroll-behavior-y: contain; }
        input, textarea, select, button {
            -webkit-tap-highlight-color: transparent;
        }

        /* ===== 加载动画 ===== */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .plan-card { animation: fadeInUp 0.22s ease both; }

        /* ===== 响应式：平板 ===== */
        @media (max-width: 900px) {
            body { padding: 16px 14px 32px; }
            .container { max-width: 100%; }

            .header { padding: 16px 20px; }
            .header h1 { font-size: 1.3em; }

            .stats-container { grid-template-columns: repeat(2, 1fr); gap: 10px; }

            .content-area { padding: 18px 18px; }
        }

        /* ===== 响应式：手机 ===== */
        @media (max-width: 640px) {
            body { padding: 10px 10px 28px; }

            /* Header */
            .header {
                padding: 14px 16px;
                border-radius: var(--radius-md);
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
            .header h1 { font-size: 1.15em; }
            .header p { font-size: 0.82em; flex-wrap: wrap; gap: 6px; }

            /* Tabs */
            .tabs {
                gap: 3px;
                padding: 5px;
                border-radius: var(--radius-lg);
                overflow-x: auto;
                flex-wrap: nowrap;
                -webkit-overflow-scrolling: touch;
                scrollbar-width: none;
            }
            .tabs::-webkit-scrollbar { display: none; }
            .tab {
                padding: 8px 14px;
                font-size: 12.5px;
                flex-shrink: 0;
                border-radius: 16px;
            }

            /* 统计卡片 */
            .stats-container { grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; }
            .stat-card { padding: 14px 14px; gap: 12px; }
            .stat-icon { width: 40px; height: 40px; font-size: 1.3em; border-radius: var(--radius-sm); }
            .stat-value { font-size: 1.6em; }
            .stat-label { font-size: 10.5px; }

            /* 内容区 */
            .content-area { padding: 14px 12px; border-radius: var(--radius-md); min-height: auto; }
            .section-header { margin-bottom: 14px; padding-bottom: 12px; flex-wrap: wrap; gap: 8px; }
            .section-header h2 { font-size: 1.1em; }
            .add-btn { padding: 8px 16px; font-size: 13px; }

            /* 计划卡片 */
            .plan-card { padding: 14px 14px; border-radius: var(--radius-sm); }
            .plan-header { flex-direction: column; gap: 10px; margin-bottom: 10px; }
            .plan-actions {
                display: flex;
                gap: 8px;
                width: 100%;
                margin-left: 0;        /* 消除桌面端的 margin-left */
            }
            .action-btn {
                flex: 1;
                padding: 10px 8px;
                font-size: 13px;
                text-align: center;
                border-radius: var(--radius-sm);
                min-height: 42px;      /* 符合 iOS HIG 触控最小尺寸 */
                min-width: 0;          /* 重置桌面端 min-width，让 flex:1 真正平分 */
                display: flex;
                align-items: center;
                justify-content: center;
                line-height: 1.2;
            }
            .plan-title { font-size: 1em; margin-bottom: 6px; }
            .plan-meta { font-size: 12px; gap: 6px; }

            /* 弹窗 */
            .modal { padding: 0; align-items: flex-start; }
            .modal.show { padding: 12px 8px 20px; }
            .modal-content {
                width: 100%;
                max-width: 100%;
                padding: 18px 14px 16px;
                border-radius: var(--radius-md);
                max-height: calc(100vh - 32px);
            }
            .modal-header { margin-bottom: 14px; }
            .modal-header h3 { font-size: 1.05em; }

            /* 表单双列 → 单列 */
            .form-row { flex-direction: column; gap: 0; }
            .form-group { margin-bottom: 10px; }
            .form-group label { font-size: 12px; margin-bottom: 4px; }
            .form-group input,
            .form-group textarea,
            .form-group select {
                font-size: 16px; /* 防止 iOS 自动缩放 */
                padding: 10px 12px;
            }
            .form-group textarea { min-height: 76px; }

            /* 时间行：开始/结束各占一行，内部 date 与时分同行 */
            .time-form-row { flex-direction: column; gap: 0; }
            .time-form-row .form-group { width: 100%; }
            .time-row { flex-wrap: nowrap; gap: 6px; align-items: center; }
            .time-row .time-date {
                flex: 1;
                min-width: 0;
                font-size: 15px !important;
                padding: 10px 8px !important;
            }
            .time-row .time-hm { gap: 4px; flex-shrink: 0; }
            .time-row .time-hm input {
                width: 44px !important;
                padding: 10px 4px !important;
                font-size: 15px !important;
                text-align: center;
            }
            .time-colon { font-size: 16px; }

            /* 弹窗底部按钮 */
            .modal-actions { gap: 8px; margin-top: 14px; }
            .modal-actions button { padding: 12px; font-size: 14px; min-height: 44px; }

            /* 人员信息分区 */
            .personnel-section { margin-top: 14px; padding-top: 12px; }
            .section-title { font-size: 13px; margin-bottom: 10px; }
            .sub-section-title { font-size: 13px !important; font-weight: 700; }
            .sub-divider { margin-top: 12px; padding-top: 10px; }

            /* 小组卡片：移动端加背景分组 */
            .group-card {
                background: var(--bg-subtle);
                border: 1px solid var(--border);
                border-radius: var(--radius-sm);
                padding: 10px 10px 4px;
                margin-bottom: 8px;
            }
            .group-card + .group-card { margin-top: 0; }
            .group-no { display: block; } /* 移动端显示序号 */

            /* 嵌套在 form-group 内的 form-row：移动端也折叠 */
            .form-group .form-row { flex-direction: column; gap: 0; }
            .form-group .form-row .form-group { margin-bottom: 0; }
            .form-group .form-row .form-group:last-child { margin-bottom: 0; }

            /* 空状态 */
            .empty-state { padding: 40px 16px; }

            /* 搜索框 */
            .search-input { font-size: 16px; padding: 10px 14px; } /* 防 iOS 缩放 */
            .search-clear { padding: 10px 14px; font-size: 13px; }

            /* 筛选器 */
            .status-filter { margin-bottom: 14px; }
            .filter-label { padding: 6px 12px; }
            .filter-text  { font-size: 12px; }

            /* 小组信息 / 动火块 */
            .group-block { padding: 8px 8px; }
            .group-item  { padding: 8px 8px; }
            .group-label { font-size: 11px; margin-bottom: 4px; }
            .group-row   { font-size: 12px; }

            /* 动火块、办票块、卡片内容字号 */
            .firework-block { padding: 9px 10px; }
            .firework-title { font-size: 11.5px; }
            .firework-row   { font-size: 12px; }
            .ticket-person-block { padding: 8px 10px; font-size: 12px; }
            .card-content   { font-size: 13px; padding: 12px 12px; line-height: 1.65; }

            /* badge 移动端字号 */
            .badge-date   { font-size: 11px; padding: 3px 8px; max-width: 100%; }
            .badge-person,
            .badge-members { font-size: 12px; padding: 3px 8px; max-width: 100%; }
            .badge         { font-size: 11px; }
            .badge-sm      { font-size: 10.5px; }

            /* plan-meta badge 换行后垂直对齐 */
            .plan-meta { align-items: flex-start; }
        }

        /* ===== 极小屏（≤380px） ===== */
        @media (max-width: 380px) {
            .tabs { gap: 2px; }
            .tab { padding: 7px 11px; font-size: 12px; }
            .stats-container { grid-template-columns: repeat(2, 1fr); gap: 6px; }
            .stat-value { font-size: 1.4em; }

            /* 卡片信息区极小屏再压缩 */
            .plan-card { padding: 11px 10px; }
            .group-block { padding: 6px 6px; }
            .group-item  { padding: 6px 6px; }
            .group-row, .firework-row, .ticket-person-block { font-size: 11.5px; }
            .badge-date  { font-size: 10.5px; padding: 2px 6px; }
            .badge-person, .badge-members { font-size: 11px; padding: 2px 6px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>📋 新意念计划管理系统</h1>
            <p>
                多人实时协作 · 自动云端同步
                <span class="sync-status" id="syncStatus">
                    <span class="sync-dot"></span>
                    <span id="syncText">连接中...</span>
                </span>
            </p>
        </header>


        <div class="tabs">
            <button class="tab active" data-tab="weekly">周计划</button>
            <button class="tab" data-tab="monthly">月计划</button>
            <button class="tab" data-tab="completed">已完结计划</button>
            <button class="tab" data-tab="trash" style="color: #c62828;">🗑️ 回收站 <span id="trashCount" style="display:inline-block; background:#f44336; color:white; border-radius:10px; padding:1px 7px; font-size:12px; margin-left:4px; vertical-align:middle;">0</span></button>
        </div>

        <!-- 统计卡片 -->
        <div class="stats-container">
            <div class="stat-card">
                <div class="stat-icon">📊</div>
                <div class="stat-info">
                    <div class="stat-label">周计划</div>
                    <div class="stat-value" id="weeklyCount">0</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📈</div>
                <div class="stat-info">
                    <div class="stat-label">月计划</div>
                    <div class="stat-value" id="monthlyCount">0</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">✅</div>
                <div class="stat-info">
                    <div class="stat-label">已完结</div>
                    <div class="stat-value" id="completedCount">0</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📋</div>
                <div class="stat-info">
                    <div class="stat-label">总计</div>
                    <div class="stat-value" id="totalCount">0</div>
                </div>
            </div>
        </div>

        <div class="content-area">
            <div class="section-header">
                <h2 id="sectionTitle">周计划</h2>
                <button class="add-btn" id="addPlanBtn">+ 新增计划</button>
            </div>

            <!-- 全局搜索框 -->
            <div class="search-wrap">
                <div class="search-inner">
                    <input type="text" id="searchInput" placeholder="🔍 搜索计划（立项名、工作内容、负责人、票型...）"
                           class="search-input"
                           autocomplete="off" autocorrect="off" autocapitalize="off">
                    <button id="clearSearchBtn" class="search-clear">✕ 清空</button>
                </div>
            </div>

            <!-- 状态筛选器（仅周计划显示） -->
            <div id="weeklyStatusFilter" class="status-filter">
                <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
                    <label class="filter-label" id="label-statusPending">
                        <span class="filter-dot" style="background:#9ca3af;"></span>
                        <input type="checkbox" id="statusPending" checked style="display:none;">
                        <span class="filter-text" style="color:#6b7280;">待开始</span>
                    </label>
                    <label class="filter-label" id="label-statusInProgress" style="border-color:#6ee7b7;">
                        <span class="filter-dot" style="background:#10b981;"></span>
                        <input type="checkbox" id="statusInProgress" checked style="display:none;">
                        <span class="filter-text" style="color:#059669;">进行中</span>
                    </label>
                    <label class="filter-label" id="label-statusPaused" style="border-color:#fcd34d;">
                        <span class="filter-dot" style="background:#f59e0b;"></span>
                        <input type="checkbox" id="statusPaused" checked style="display:none;">
                        <span class="filter-text" style="color:#d97706;">间断中</span>
                    </label>
                    <label class="filter-label" id="label-showNextWeek" style="border-color:#93c5fd;">
                        <span class="filter-dot" style="background:#3b82f6;"></span>
                        <input type="checkbox" id="showNextWeek" style="display:none;">
                        <span class="filter-text" style="color:#2563eb;">下周计划</span>
                    </label>
                </div>
            </div>

            <!-- 年份筛选器和图表按钮（仅已完结计划显示） -->
            <div id="yearFilter" style="display: none; margin-bottom: 18px; padding: 14px 18px; background: var(--bg-subtle); border-radius: var(--radius-md); border: 1px solid var(--border);">
                <div style="display: flex; gap: 14px; align-items: center; flex-wrap: wrap;">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span style="font-size: 12.5px; font-weight: 600; color: var(--text-secondary);">年份</span>
                        <select id="yearSelect" style="padding: 7px 12px; border-radius: var(--radius-md); border: 1.5px solid var(--border); font-size: 13px; background: white; cursor: pointer; color: var(--text-primary); outline: none; font-family: var(--font);">
                            <option value="">全部</option>
                        </select>
                    </div>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span style="font-size: 12.5px; font-weight: 600; color: var(--text-secondary);">月份</span>
                        <select id="monthSelect" style="padding: 7px 12px; border-radius: var(--radius-md); border: 1.5px solid var(--border); font-size: 13px; background: white; cursor: pointer; color: var(--text-primary); outline: none; font-family: var(--font);">
                            <option value="">全部</option>
                            <option value="1">1月</option>
                            <option value="2">2月</option>
                            <option value="3">3月</option>
                            <option value="4">4月</option>
                            <option value="5">5月</option>
                            <option value="6">6月</option>
                            <option value="7">7月</option>
                            <option value="8">8月</option>
                            <option value="9">9月</option>
                            <option value="10">10月</option>
                            <option value="11">11月</option>
                            <option value="12">12月</option>
                        </select>
                    </div>
                    <button class="add-btn" id="toggleChartBtn" style="padding: 8px 16px; font-size: 12.5px;">📊 统计图表</button>
                </div>
            </div>

            <!-- 统计图表（仅已完结计划显示，默认隐藏） -->
            <div id="chartContainer" style="display: none; margin-bottom: 20px; padding: 20px 20px 16px; background: var(--bg-subtle); border-radius: var(--radius-md); border: 1px solid var(--border);">
                <h3 id="chartTitle" style="margin-bottom: 4px; color: var(--text-primary); font-size: 15px; font-weight: 700;">已完结计划统计（按立项名）</h3>
                <p style="margin: 0 0 16px; font-size: 12px; color: var(--text-muted);">鼠标悬停在标签上可查看完整名称</p>
                <div id="chartCanvas" style="position: relative; overflow-x: auto;"></div>
                <div id="chartLegend" style="margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 10px;"></div>
            </div>

            <div class="plan-list" id="planList"></div>
        </div>
    </div>




    <!-- 补录票号对话框 -->
    <div id="ticketNoModal" style="display: none; position: fixed; z-index: 999999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(17,24,39,0.50); backdrop-filter: blur(3px);">
        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; border-radius: var(--radius-lg); padding: 28px; width: min(420px, 94vw); box-shadow: 0 20px 60px rgba(17,24,39,0.22); border: 1px solid var(--border);">
            <div style="font-size: 17px; font-weight: 700; color: var(--text-primary); margin-bottom: 5px;">✏️ 补录票号</div>
            <div id="ticketNoModalTitle" style="font-size: 12.5px; color: var(--text-secondary); margin-bottom: 20px; padding-bottom: 14px; border-bottom: 1.5px solid var(--border);"></div>
            <div style="margin-bottom: 14px;">
                <label style="display: block; font-size: 12.5px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px;">工作票号</label>
                <input type="text" id="ticketNoInput" placeholder="输入工作票号" style="width: 100%; padding: 9px 13px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); font-size: 13.5px; box-sizing: border-box; outline: none; transition: border-color 0.2s, box-shadow 0.2s; font-family: var(--font); background: var(--bg-subtle);"
                    onfocus="this.style.borderColor='var(--primary)';this.style.boxShadow='0 0 0 3px rgba(79,110,242,0.10)';this.style.background='white'"
                    onblur="this.style.borderColor='var(--border)';this.style.boxShadow='none';this.style.background='var(--bg-subtle)'">
            </div>
            <div style="margin-bottom: 24px;">
                <label style="display: block; font-size: 12.5px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px;">计划编号</label>
                <input type="text" id="planNoInput" placeholder="输入计划编号" style="width: 100%; padding: 9px 13px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); font-size: 13.5px; box-sizing: border-box; outline: none; transition: border-color 0.2s, box-shadow 0.2s; font-family: var(--font); background: var(--bg-subtle);"
                    onfocus="this.style.borderColor='var(--primary)';this.style.boxShadow='0 0 0 3px rgba(79,110,242,0.10)';this.style.background='white'"
                    onblur="this.style.borderColor='var(--border)';this.style.boxShadow='none';this.style.background='var(--bg-subtle)'">
            </div>
            <div style="display: flex; gap: 10px;">
                <button id="ticketNoCancelBtn" style="flex:1; padding: 10px; border: 1.5px solid var(--border); border-radius: var(--radius-md); background: var(--bg-subtle); color: var(--text-secondary); font-size: 13.5px; font-weight: 600; cursor: pointer; font-family: var(--font); transition: background 0.15s;">取消</button>
                <button id="ticketNoSaveBtn" style="flex:1; padding: 10px; background: var(--primary-grad); border: none; border-radius: var(--radius-md); color: white; font-size: 13.5px; font-weight: 600; cursor: pointer; font-family: var(--font); box-shadow: 0 2px 8px rgba(79,110,242,0.30);">💾 保存</button>
            </div>
        </div>
    </div>

    <!-- 删除确认对话框 -->
    <div id="deleteConfirmModal" style="display: none; position: fixed; z-index: 999999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(26,31,54,0.55); backdrop-filter: blur(2px);">
        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; border-radius: 20px; padding: 32px 24px; width: min(360px, 92vw); box-shadow: 0 16px 56px rgba(26,31,54,0.25); text-align: center;">
            <div style="font-size: 44px; margin-bottom: 12px;">🗑️</div>
            <div style="font-size: 17px; font-weight: 700; color: var(--text-primary); margin-bottom: 8px;">移入回收站</div>
            <div style="font-size: 13px; color: var(--text-secondary); margin-bottom: 24px; line-height: 1.8;">计划将移入回收站，<br>可在回收站中恢复或永久删除。</div>
            <div style="display: flex; gap: 12px;">
                <button id="deleteCancelBtn" style="flex: 1; padding: 12px 8px; border: 1.5px solid var(--border); border-radius: 24px; background: white; font-size: 14px; font-weight: 600; color: var(--text-secondary); cursor: pointer; transition: all 0.2s; min-height: 44px;">取消</button>
                <button id="deleteConfirmBtn" style="flex: 1; padding: 12px 8px; border: none; border-radius: 24px; background: linear-gradient(135deg, #e53935 0%, #c62828 100%); font-size: 14px; font-weight: 600; color: white; cursor: pointer; transition: all 0.2s; box-shadow: 0 2px 8px rgba(229,57,53,0.3); min-height: 44px;">移入回收站</button>
            </div>
        </div>

    <script type="module">
        import { createClient } from 'https://cdn.skypack.dev/@supabase/supabase-js@2';

        window.supabaseCreateClient = createClient;

        var supabaseClient = null;
        var plans = [];
        var currentTab = 'weekly';
        var editingPlanId = null;

        var planTypeNames = {
            weekly: '周计划',
            monthly: '月计划',
            completed: '已完结计划',
            trash: '🗑️ 回收站'
        };

        window.onload = function() {
            console.log('页面加载完成');
            initSupabase();
            initTabs();
            initEventListeners();
        };

        function initSupabase() {
            var config = {
                url: 'https://cuvkfshykabvwnhrremb.supabase.co',
                key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN1dmtmc2h5a2FidnduaHJyZW1iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxMzIwNjksImV4cCI6MjA4ODcwODA2OX0.R3HDrqefIimS7HZsXoU1dZorB2jep-1LT5pc8O0tcP4'
            };

            if (typeof supabaseCreateClient === 'undefined') {
                console.error('Supabase 库未加载');
                setSyncStatus('error', '库加载失败');
                return;
            }

            try {
                supabaseClient = supabaseCreateClient(config.url, config.key);
                loadPlans();
                setupRealtime();
            } catch (error) {
                console.error('Supabase 初始化失败:', error);
                setSyncStatus('error', '连接失败');
            }
        }

        function setupRealtime() {
            if (!supabaseClient) return;

            var timeoutId = setTimeout(function() {
                setSyncStatus('connected', '已连接');
            }, 5000);

            supabaseClient.channel('plans-changes')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'plans' }, function(payload) {
                    loadPlans();
                })
                .subscribe(function(status, err) {
                    if (status === 'SUBSCRIBED') {
                        clearTimeout(timeoutId);
                        setSyncStatus('connected', '已连接');
                    } else if (status === 'CLOSED') {
                        clearTimeout(timeoutId);
                        setSyncStatus('error', '连接断开');
                    } else if (status === 'CHANNEL_ERROR') {
                        clearTimeout(timeoutId);
                        console.error('实时订阅错误:', err);
                        setSyncStatus('error', '连接错误');
                    }
                }, {
                    timeout: 5000
                });
        }

        function setSyncStatus(status, text) {
            var syncStatus = document.getElementById('syncStatus');
            var syncText = document.getElementById('syncText');
            syncStatus.className = 'sync-status ' + status;
            syncText.textContent = text;
        }

        function loadPlans() {
            if (!supabaseClient) return;

            setSyncStatus('syncing', '同步中...');

            supabaseClient.from('plans')
                .select('*')
                .order('created_at', { ascending: false })
                .then(function(result) {
                    var data = result.data;
                    var error = result.error;

                    if (error) {
                        console.error('加载数据失败:', error);
                        setSyncStatus('error', '同步失败');
                        return;
                    }

                    plans = data.map(function(plan) {
                        return {
                            id: plan.id,
                            type: plan.type,
                            title: plan.title,
                            titleBase: plan.title_base,
                            titleSuffix: plan.title_suffix,
                            content: plan.content,
                            workTicketNo: plan.work_ticket_no || '',
                            planNo: plan.plan_no || '',
                            startDate: plan.start_date,
                            endDate: plan.end_date,
                            ticketType: plan.ticket_type,
                            priority: plan.priority,
                            status: plan.status,
                            equipmentStatus: plan.equipment_status || '',
                            responsible: plan.responsible || '',
                            members: plan.members || '',
                            group1Leader: plan.group1_leader || '',
                            group1Members: plan.group1_members || '',
                            group2Leader: plan.group2_leader || '',
                            group2Members: plan.group2_members || '',
                            group3Leader: plan.group3_leader || '',
                            group3Members: plan.group3_members || '',
                            group4Leader: plan.group4_leader || '',
                            group4Members: plan.group4_members || '',
                            group5Leader: plan.group5_leader || '',
                            group5Members: plan.group5_members || '',
                            ticketPersonnel: plan.ticket_personnel || '',
                            fireWorkLeader: plan.fire_work_leader || '',
                            fireWorkExecutor: plan.fire_work_executor || '',
                            fireWorkGuardian: plan.fire_work_guardian || '',
                            isDeleted: plan.is_deleted || false,
                            deletedAt: plan.deleted_at || null,
                            isTransferred: plan.is_transferred || false,
                            transferredAt: plan.transferred_at || null,
                            createdAt: plan.created_at,
                            updatedAt: plan.updated_at
                        };
                    });

                    renderPlans();
                    updateStats();
                    setSyncStatus('connected', '已连接');
                    // 每周一自动将下一周的月计划标记为已转移
                    autoTransferMonthlyPlans();
                    // 检查是否有计划已到结束时间，自动标记为已完成
                    autoCompleteExpiredPlans();
                });
        }

        // 自动将开始时间在下一周内的月计划标记为已转移（持久化到数据库，任何时候加载都检测）
        function autoTransferMonthlyPlans() {
            if (!supabaseClient) return;

            // 找出开始时间在本周或下一周内、尚未标记转移的月计划
            var toTransfer = plans.filter(function(p) {
                return p.type === 'monthly'
                    && !p.isDeleted
                    && !p.isTransferred
                    && p.status !== 'completed'
                    && p.startDate
                    && (isInCurrentWeek(p.startDate) || isInNextWeek(p.startDate));
            });

            if (toTransfer.length === 0) return;

            var now = new Date().toISOString();
            var ids = toTransfer.map(function(p) { return p.id; });
            console.log('[转移] 准备转移月计划:', ids.length, '个');

            supabaseClient.from('plans')
                .update({ is_transferred: true, transferred_at: now })
                .in('id', ids)
                .then(function(result) {
                    if (result.error) {
                        console.error('[转移] 数据库更新失败:', result.error);
                        return;
                    }
                    plans.forEach(function(p) {
                        if (ids.indexOf(p.id) !== -1) {
                            p.isTransferred = true;
                            p.transferredAt = now;
                        }
                    });
                    renderPlans();
                    updateStats();
                });
        }

        // 自动检查结束时间已过的计划，将其状态更新为已完成
        function autoCompleteExpiredPlans() {
            if (!supabaseClient) return;

            var now = new Date();
            var toComplete = plans.filter(function(p) {
                return !p.isDeleted
                    && p.status !== 'completed'
                    && p.endDate
                    && new Date(p.endDate) < now;
            });

            if (toComplete.length === 0) return;

            var nowIso = now.toISOString();
            var ids = toComplete.map(function(p) { return p.id; });

            supabaseClient.from('plans')
                .update({ status: 'completed', updated_at: nowIso })
                .in('id', ids)
                .then(function(result) {
                    if (result.error) {
                        console.error('[自动完成] 数据库更新失败:', result.error);
                        return;
                    }
                    plans.forEach(function(p) {
                        if (ids.indexOf(p.id) !== -1) {
                            p.status = 'completed';
                            p.updatedAt = nowIso;
                        }
                    });
                    renderPlans();
                    updateStats();
                });
        }

        // 每分钟检查一次是否有计划到期
        setInterval(function() {
            if (plans && plans.length > 0) {
                autoCompleteExpiredPlans();
            }
        }, 60 * 1000);

        function savePlanToCloud(planData) {
            if (!supabaseClient) {
                return Promise.reject(new Error('未连接到数据库'));
            }

            setSyncStatus('syncing', '保存中...');

            var dbData = {
                id: planData.id,
                type: planData.type,
                title: planData.title,
                title_base: planData.titleBase,
                title_suffix: planData.titleSuffix,
                content: planData.content,
                work_ticket_no: planData.workTicketNo || null,
                plan_no: planData.planNo || null,
                start_date: planData.startDate,
                end_date: planData.endDate,
                ticket_type: planData.ticketType,
                priority: planData.priority,
                status: planData.status,
                equipment_status: planData.equipmentStatus,
                responsible: planData.responsible,
                members: planData.members,
                group1_leader: planData.group1Leader,
                group1_members: planData.group1Members,
                group2_leader: planData.group2Leader,
                group2_members: planData.group2Members,
                group3_leader: planData.group3Leader,
                group3_members: planData.group3Members,
                group4_leader: planData.group4Leader,
                group4_members: planData.group4Members,
                group5_leader: planData.group5Leader,
                group5_members: planData.group5Members,
                ticket_personnel: planData.ticketPersonnel,
                fire_work_leader: planData.fireWorkLeader,
                fire_work_executor: planData.fireWorkExecutor,
                fire_work_guardian: planData.fireWorkGuardian,
                is_transferred: planData.isTransferred || false,
                transferred_at: planData.transferredAt || null
            };

            return supabaseClient.from('plans')
                .upsert(dbData)
                .select()
                .single()
                .then(function(result) {
                    if (result.error) {
                        throw result.error;
                    }
                    return result.data;
                });
        }

        function deletePlanFromCloud(planId) {
            if (!supabaseClient) {
                return Promise.reject(new Error('未连接到数据库'));
            }

            // 软删除：将计划标记为已删除，移入回收站
            return supabaseClient.from('plans')
                .update({ is_deleted: true, deleted_at: new Date().toISOString() })
                .eq('id', planId)
                .then(function(result) {
                    if (result.error) {
                        throw result.error;
                    }
                });
        }

        function restorePlanFromTrash(planId) {
            if (!supabaseClient) {
                return Promise.reject(new Error('未连接到数据库'));
            }

            return supabaseClient.from('plans')
                .update({ is_deleted: false, deleted_at: null })
                .eq('id', planId)
                .then(function(result) {
                    if (result.error) {
                        throw result.error;
                    }
                });
        }

        function permanentDeletePlan(planId) {
            if (!supabaseClient) {
                return Promise.reject(new Error('未连接到数据库'));
            }

            return supabaseClient.from('plans')
                .delete()
                .eq('id', planId)
                .then(function(result) {
                    if (result.error) {
                        throw result.error;
                    }
                });
        }

        // 根据标签页更新 UI 显示（筛选器、按钮、图表）
        function applyTabUI(tab) {
            var addBtn             = document.getElementById('addPlanBtn');
            var weeklyStatusFilter = document.getElementById('weeklyStatusFilter');
            var yearFilter         = document.getElementById('yearFilter');
            var chartContainer     = document.getElementById('chartContainer');

            addBtn.style.display             = (tab === 'weekly' || tab === 'monthly') ? 'block' : 'none';
            weeklyStatusFilter.style.display = (tab === 'weekly')    ? 'block' : 'none';
            yearFilter.style.display         = (tab === 'completed') ? 'block' : 'none';
            chartContainer.style.display     = (tab === 'completed') ? 'block' : 'none';

            if (tab === 'completed') {
                updateYearFilter();
                renderChart();
            }
        }

        function initEventListeners() {
            var tabs = document.querySelectorAll('.tab');
            tabs.forEach(function(tab) {
                tab.addEventListener('click', function() {
                    tabs.forEach(function(t) { t.classList.remove('active'); });
                    tab.classList.add('active');
                    currentTab = tab.dataset.tab;
                    document.getElementById('sectionTitle').textContent = planTypeNames[currentTab];
                    applyTabUI(currentTab);
                    renderPlans();
                });
            });

            // 年份筛选监听
            document.getElementById('yearSelect').addEventListener('change', function() {
                renderPlans();
                if (document.getElementById('chartContainer').style.display !== 'none') {
                    renderChart();
                }
            });

            // 月份筛选监听
            document.getElementById('monthSelect').addEventListener('change', function() {
                renderPlans();
                if (document.getElementById('chartContainer').style.display !== 'none') {
                    renderChart();
                }
            });

            // 周计划状态筛选监听 + 视觉联动
            var filterColors = {
                'statusPending':   { border: '#9e9e9e', bg: '#f5f5f5',  dot: '#9e9e9e' },
                'statusInProgress':{ border: '#4caf50', bg: '#e8f5e9',  dot: '#4caf50' },
                'statusPaused':    { border: '#ff9800', bg: '#fff3e0',  dot: '#ff9800' },
                'showNextWeek':    { border: '#1976d2', bg: '#e3f2fd',  dot: '#1976d2' }
            };

            function updateFilterStyle(id) {
                var checkbox = document.getElementById(id);
                var label = document.getElementById('label-' + id);
                if (!checkbox || !label) return;
                var color = filterColors[id];
                if (checkbox.checked) {
                    label.style.background = color.bg;
                    label.style.borderColor = color.border;
                    label.style.opacity = '1';
                } else {
                    label.style.background = '#fafafa';
                    label.style.borderColor = '#e0e0e0';
                    label.style.opacity = '0.5';
                }
            }

            ['statusPending', 'statusInProgress', 'statusPaused', 'showNextWeek'].forEach(function(id) {
                var checkbox = document.getElementById(id);
                if (checkbox) {
                    // 初始化样式
                    updateFilterStyle(id);
                    checkbox.addEventListener('change', function() {
                        updateFilterStyle(id);
                        renderPlans();
                    });
                } else {
                    console.error('找不到元素:', id);
                }
            });

            // 图表显示/隐藏按钮
            document.getElementById('toggleChartBtn').addEventListener('click', function() {
                var chartContainer = document.getElementById('chartContainer');
                var toggleBtn = document.getElementById('toggleChartBtn');

                if (chartContainer.style.display === 'none') {
                    chartContainer.style.display = 'block';
                    toggleBtn.textContent = '📊 隐藏统计图表';
                    renderChart();
                } else {
                    chartContainer.style.display = 'none';
                    toggleBtn.textContent = '📊 显示统计图表';
                }
            });

            document.getElementById('addPlanBtn').addEventListener('click', function() {
                openModal();
            });

            // 搜索功能监听
            document.getElementById('searchInput').addEventListener('input', function() {
                renderPlans();

            // 清空搜索按钮

                document.getElementById('searchInput').value = '';
                renderPlans();

            document.getElementById('closeModalBtn').addEventListener('click', function() {
                closeModal();
            });

            document.getElementById('cancelBtn').addEventListener('click', function() {
                closeModal();
            });

            document.getElementById('planForm').addEventListener('submit', function(e) {
                e.preventDefault();
                savePlan();

            // 禁用点击模态框外部关闭功能（锁定模态框）
            // document.getElementById('planModal').addEventListener('click', function(e) {
            //     if (e.target.id === 'planModal') {
            //         closeModal();
            //     }
            // });

            // 监听计划类型变化
            document.getElementById('planType').addEventListener('change', function(e) {
                togglePersonnelFields(e.target.value);
            });

            // 使用事件委托处理编辑、补录票号和删除按钮点击
            document.getElementById('planList').addEventListener('click', function(e) {
                // 优先判断补录票号按钮（有 data-ticket-plan-id 属性）
                var ticketBtn = e.target.closest('[data-ticket-plan-id]');
                var editBtn   = e.target.closest('.edit-btn');
                var deleteBtn = e.target.closest('.delete-btn');

                if (ticketBtn) {
                    openTicketNoModal(ticketBtn.dataset.ticketPlanId);
                } else if (editBtn) {
                    var planId = editBtn.dataset.planId;
                    if (planId) openModal(planId);

                    var planId = deleteBtn.dataset.planId;
