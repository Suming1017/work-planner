        }

        function saveLocalPlans() {
            try { localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(plans)); }
            catch (e) { /* 隐私模式 / 空间不足时忽略 */ }
        }

        // 判断是网络层失败（请求没发出去）而不是服务端返回的业务错误
        function isNetworkFailure(error) {
            if (!error) return true;
            if (error.code) return false;                 // PostgREST 的业务错误码
            var name = String(error.name || '');
            var text = String(error.message || '');
            return text.indexOf('fetch') !== -1 ||
                   text.indexOf('Load failed') !== -1 ||
                   text.indexOf('NetworkError') !== -1 ||
                   name.indexOf('Abort') !== -1 ||
                   name.indexOf('Timeout') !== -1;
        }

        function enterLocalMode() {
            if (localMode) return;
            localMode = true;
            loadRetry = 0;
            plans = loadLocalPlans();
            lastDataSig = '';
            lastListHtml = null;
            setSyncStatus('local', '本地预览');
            renderPlans();
            updateStats();
            if (currentTab === 'completed') { updateYearFilter(); renderChart(); }
        }

        // 退出本地模式、重新尝试连云端（按钮 / 网络恢复时调用）
        function retryCloud() {
            localMode = false;
            guideRendered = false;
            syncErrorHint = '';
            lastDataSig = '';
            lastListHtml = null;
            realtimeGiveUp = false;
            realtimeRetryCount = 0;
            if (supabaseClient) { setSyncStatus('syncing', '连接中...'); loadPlans(); }
            else initSupabase();
        }

        function localModeBanner() {
            return '<div class="local-mode-tip">' +
                '<p>💾 本地预览模式（数据只存在本浏览器，不会上传云端）</p>' +
                '<p>当前浏览器禁止「本地文件」页面访问云端接口，已自动切换，界面与操作均可正常试用。</p>' +
                '<p style="margin-top:8px;">需要真正多人同步时，把本文件上传到 GitHub Pages，' +
                '用 http 地址打开即可自动切回云端模式。</p>' +
                '<p style="margin-top:10px;">' +
                '<button type="button" id="retryCloudBtn" style="padding:8px 18px;font-size:14px;' +
                'border:0;border-radius:8px;background:#1565c0;color:#fff;cursor:pointer;">' +
                '☁️ 重试连接云端</button>' +
                '</p>' +
                '</div>';
        }

        // silent=true 时不动状态栏，用于轮询 / 重连等后台刷新
        // 数据未变化时整条渲染链会被跳过，所以后台刷新不会有任何视觉闪烁
        function loadPlans(silent) {
            // 本地预览模式下数据就在内存/localStorage 里，不需要也不能去请求云端
            if (localMode) return;
            if (!supabaseClient || loadInFlight) return;
            loadInFlight = true;
            if (!silent) setSyncStatus('syncing', '同步中...');

            withTimeout(
                supabaseClient.from('plans').select(selectColumns).order('created_at', { ascending: false }),
                REQUEST_TIMEOUT
            )
                .then(function(result) {
                    if (result.error) throw result.error;
                    loadInFlight = false;
                    return result.data || [];
                })
                .then(function(rows) {
                    loadRetry = 0;
                    guideRendered = false;        // 恢复成功，允许下次失败时再提示
                    lastSyncedAt = Date.now();
                    setSyncStatus('connected', '已连接');

                    // 数据逐字节一致 → 什么都不做：不重绘、不重算统计、不跑自动任务
                    var sig = JSON.stringify(rows);
                    if (sig === lastDataSig) return;
                    lastDataSig = sig;

                    plans = rows.map(rowToPlan);
                    renderPlans();
                    updateStats();
                    if (currentTab === 'completed') {
                        updateYearFilter();
                        renderChart();
                    }
                    runAutoTasks();   // 月转周 + 到期自动完成（内部含并发/可见性判断）
                })
                .catch(function(error) {
                    loadInFlight = false;

                    // 线上库列不齐 → 降级为 select('*')，页面照常可用
                    if (isSchemaError(error) && selectColumns !== '*') {
                        console.warn('[同步] 查询列与线上库不一致，已自动降级为 select(*)。' +
                                     '请在 Supabase SQL Editor 执行 database-schema.sql 补齐列。',
                                     error);
                        selectColumns = '*';
                        loadPlans(silent);
                        return;
                    }

                    console.error('加载数据失败:', {
                        code: error && error.code,
                        message: error && error.message,
                        details: error && error.details,
                        hint: error && error.hint
                    });

                    // file:// 页面发出的跨域 fetch 会被浏览器直接掐掉（请求根本没发出去）。
                    // 此时实时 WebSocket 往往还能连上 —— 说明网络没问题，是浏览器的安全策略。
                    // 这种情况下自动切到本地预览模式，保证界面照常可用。
                    if (isFileOrigin() && isNetworkFailure(error)) {
                        syncErrorHint = '浏览器禁止「本地文件」页面访问云端接口（请求未发出）。' +
                                        '已切换到本地预览模式。';
                        enterLocalMode();
                        return;
                    }

                    syncErrorHint = describeError(error);
                    scheduleRetry();
                });
        }

        // 判断是否「表/列不存在」这类架构问题
        function isSchemaError(error) {
            var code = String((error && error.code) || '');
            var text = String((error && error.message) || (error && error.details) || '');
            if (code === '42703' || code === '42P01' || code === 'PGRST204') return true;
            return text.indexOf('does not exist') !== -1 ||
                   text.indexOf('Could not find the') !== -1 ||
                   text.indexOf('schema cache') !== -1;
        }

        // 把 PostgREST / 网络错误翻成人看得懂的提示
        function describeError(error) {
            var code = String((error && error.code) || '');
            var text = String((error && error.message) || '');

            if (code === '42703' || text.indexOf('does not exist') !== -1) {
                var m = text.match(/plans\.([a-z0-9_]+)/);
                return '数据库缺少列' + (m ? ' (' + m[1] + ')' : '') + '，请执行 database-schema.sql';
            }
            if (code === '42P01') return '找不到 plans 表，请执行 database-schema.sql';
            if (code === '42501' || text.indexOf('row-level security') !== -1) {
                return '被行级安全策略(RLS)拦截，请执行 fix-permissions.sql';
            }
            if (code === '401' || text.indexOf('Invalid API key') !== -1 || text.indexOf('No API key') !== -1) {
                return '匿名 key 无效或已轮换，请到 Supabase → Settings → API 复制新 key';
            }
            if (code === '404') return '接口/表不存在(404)，请确认项目 URL 与表名';
            if (text.indexOf('Failed to fetch') !== -1 || text.indexOf('NetworkError') !== -1 || text.indexOf('Load failed') !== -1) {
                return '网络请求失败：检查手机网络/公司防火墙是否拦截 supabase.co。' + fileOriginHint();
            }
            return text || (error && error.name) || '未知错误';
        }

        // 失败退避重试：2s → 4s → 8s → 16s → 30s，六次仍失败则交给 60s 轮询慢慢补，不无限重试
        function scheduleRetry() {
            loadRetry++;
            if (loadRetry > MAX_LOAD_RETRY) {               // 静默降级到轮询，不再打扰状态栏
                // 只渲染一次：轮询每次失败都会走到这里，不能反复重绘
                if (!guideRendered) {
                    guideRendered = true;
                    renderConnectionGuide();
                }
                return;
            }
            // 已经成功同步过（界面上有数据）时，后台刷新的偶发失败不打回"同步失败"。
            // "已连接 → 同步失败 → 已连接" 的来回跳变比真实抖动更干扰使用；
            // 真正连不上（几次都没拿到数据）时才明确报错并给排查指引。
            if (!(lastSyncedAt > 0 && loadRetry < 3)) {
                setSyncStatus('error', loadRetry > 2 ? '同步失败·重试中' : '同步失败');
            }
            var delay = Math.min(2000 * Math.pow(2, loadRetry - 1), 30000);
            setTimeout(function() {
                if (supabaseClient) loadPlans(true);
            }, delay);
        }

        // 重试全部用尽：状态栏不再抖动，但在列表区给出可操作的排查指引
        function renderConnectionGuide() {
            var reason = syncErrorHint || '未知原因';
            if (isFileOrigin() && reason.indexOf('http-server') === -1) {
                reason += ' ' + fileOriginHint();
                syncErrorHint = reason;
            }
            setSyncStatus('error', '同步失败');
            document.getElementById('planList').innerHTML =
                '<div class="file-origin-tip" style="max-width:640px;margin:0 auto;">' +
                '<p>☁️ 云端数据暂时读取不到</p>' +
                '<p>已连续重试 ' + MAX_LOAD_RETRY + ' 次仍未成功。原因：' + escapeHtml(reason) + '</p>' +
                '<p style="margin-top:8px;">建议按以下顺序排查：</p>' +
                '<p>1) 先点下面的「重新连接」按钮；多数情况只是刚才网络抖动。</p>' +
                '<p>2) 若当前是双击本地文件打开（file://）：夸克、UC 等手机浏览器会拦截此类请求。' +
                '请改用 http 方式 —— 双击本目录 start-node-server.bat，用命令行显示的地址打开。</p>' +
                '<p>3) 手机上日常使用：把 work-planner-v2.html 上传到 GitHub Pages 后访问站点地址即可。</p>' +
                '<p style="margin-top:12px;">' +
                '<button type="button" id="reconnectBtn" style="padding:10px 20px;font-size:15px;' +
                'border:0;border-radius:8px;background:#1565c0;color:#fff;cursor:pointer;">' +
                '🔄 重新连接</button>' +
                '</p>' +
                '</div>';

            var btn = document.getElementById('reconnectBtn');
            if (btn) {
                btn.onclick = function() {
                    loadRetry = 0;
                    guideRendered = false;
                    syncErrorHint = '';
                    setSyncStatus('syncing', '重新连接中...');
                    renderLoading();
                    if (supabaseClient) loadPlans(true);
                    else initSupabase();
                };
            }
            // 到这一步说明确实连不上，顺手把自检报告打出来，省得再手动加 ?diag=1
            setTimeout(runDiagnostics, 300);
        }

        /* ================================================================
         * 五、写入（统一出口，消除重复的 update 语句）
         * ================================================================ */
        // 单条更新
        function dbUpdate(planId, patch) {
            if (localMode) {                       // 本地预览：只改本地，不发请求
                applyLocal(planId, localPatchOf(patch));
                saveLocalPlans();
                return Promise.resolve();
            }
            if (!supabaseClient) return Promise.reject(new Error('未连接到数据库'));
            noteLocalWrite();
            return withTimeout(
                supabaseClient.from('plans').update(patch).eq('id', planId),
                REQUEST_TIMEOUT
            ).then(function(result) {
                if (result.error) throw result.error;
            });
        }

        // 批量更新，并同步刷新本地缓存
        function batchUpdate(ids, patch) {
            if (!ids.length) return Promise.resolve();
            if (localMode) {                       // 本地预览：只改本地，不发请求
                var lp = localPatchOf(patch);
                ids.forEach(function(id) {
                    var plan = plans.find(function(p) { return p.id === id; });
                    if (plan) Object.assign(plan, lp);
                });
                saveLocalPlans();
                renderPlans();
                updateStats();
                return Promise.resolve();
            }
            if (!supabaseClient) return Promise.resolve();
            var localPatch = localPatchOf(patch);
            noteLocalWrite();
            return withTimeout(
                supabaseClient.from('plans').update(patch).in('id', ids),
                REQUEST_TIMEOUT
            ).then(function(result) {
                if (result.error) throw result.error;
                ids.forEach(function(id) {
                    var plan = plans.find(function(p) { return p.id === id; });
                    if (plan) Object.assign(plan, localPatch);
                });
                renderPlans();
                updateStats();
            });
        }

        // 本地乐观更新 + 重绘
        function applyLocal(planId, patch) {
            var plan = plans.find(function(p) { return p.id === planId; });
            if (plan) Object.assign(plan, patch);
            renderPlans();
            updateStats();
        }

        function savePlanToCloud(plan) {
            if (localMode) {                       // 本地预览：存到 localStorage
                if (!plan.createdAt) plan.createdAt = new Date().toISOString();
                plan.updatedAt = new Date().toISOString();
                var idx = plans.findIndex(function(p) { return p.id === plan.id; });
                if (idx >= 0) plans[idx] = plan; else plans.unshift(plan);
                saveLocalPlans();
                renderPlans();
                updateStats();
                setSyncStatus('local', '本地预览');
                return Promise.resolve();
            }
            if (!supabaseClient) return Promise.reject(new Error('未连接到数据库'));
            setSyncStatus('syncing', '保存中...');
            noteLocalWrite();
            return withTimeout(
                supabaseClient.from('plans').upsert(planToRow(plan)),
                REQUEST_TIMEOUT
            ).then(function(result) {
                if (result.error) throw result.error;
            });
        }

        function deletePlanFromCloud(planId) {
            return dbUpdate(planId, { is_deleted: true, deleted_at: new Date().toISOString() });
        }

        function restorePlanFromTrash(planId) {
            return dbUpdate(planId, { is_deleted: false, deleted_at: null });
        }

        function permanentDeletePlan(planId) {
            if (localMode) {                       // 本地预览：只删本地
                plans = plans.filter(function(p) { return p.id !== planId; });
                saveLocalPlans();
                renderPlans();
                updateStats();
                return Promise.resolve();
            }
            if (!supabaseClient) return Promise.reject(new Error('未连接到数据库'));
            noteLocalWrite();
            return withTimeout(
                supabaseClient.from('plans').delete().eq('id', planId),
                REQUEST_TIMEOUT
            ).then(function(result) {
                if (result.error) throw result.error;
            });
        }

        /* ================================================================
         * 六、自动任务（月转周 / 自动完成）
         * ================================================================ */
        // 自动任务加并发闸：同一时刻只跑一个，避免定时器与实时回读叠加触发
        var autoTaskRunning = false;

        function runAutoTasks() {
            if (autoTaskRunning || !supabaseClient || document.hidden) return;
            autoTaskRunning = true;
            Promise.all([autoTransferMonthlyPlans(), autoCompleteExpiredPlans()])
                .catch(function() { /* 已在内部提示 */ })
                .then(function() { autoTaskRunning = false; });
        }

        function autoTransferMonthlyPlans() {
            if (!supabaseClient) return Promise.resolve();

            var now = new Date();
            // 需要出现在周计划里的月计划：开始时间在本周/下周，或已开始但未完成
            var ids = plans.filter(function(p) {
                return p.type === 'monthly'
                    && !p.isDeleted
                    && !p.isTransferred
                    && p.status !== 'completed'
                    && p.startDate
                    && (isInCurrentWeek(p.startDate) || isInNextWeek(p.startDate) || new Date(p.startDate) < now);
            }).map(function(p) { return p.id; });

            return batchUpdate(ids, { is_transferred: true, transferred_at: now.toISOString() })
                .catch(function(error) { console.error('[月转周] 更新失败:', error); });
        }

        function autoCompleteExpiredPlans() {
            if (!supabaseClient) return Promise.resolve();

            var now = new Date();
            // 仅自动完成「进行中」且结束时间已过的计划；待开始/间断中视为延期，交人工处理
            var ids = plans.filter(function(p) {
                return !p.isDeleted
                    && p.status === 'in-progress'
                    && p.endDate
                    && new Date(p.endDate) < now;
            }).map(function(p) { return p.id; });

            return batchUpdate(ids, { status: 'completed', updated_at: now.toISOString() })
                .catch(function(error) { console.error('[自动完成] 更新失败:', error); });
        }

        // 每分钟检查一次到期计划
        setInterval(runAutoTasks, 60 * 1000);

        // 轮询兜底：实时通道未就绪、或上次读取失败时，每分钟静默补一次。
        // 因为数据一致就整链跳过渲染，这里只发请求、不动界面。
        setInterval(function() {
            if (!supabaseClient || document.hidden) return;
            if (!realtimeSubscribed || loadRetry > 0) loadPlans(true);
        }, 60 * 1000);

        /* ================================================================
         * 七、标签页与事件
         * ================================================================ */
        function applyTabUI(tab) {
            document.getElementById('addPlanBtn').style.display =
                (tab === 'weekly' || tab === 'monthly') ? 'block' : 'none';
            document.getElementById('weeklyStatusFilter').style.display =
                (tab === 'weekly') ? 'block' : 'none';
            document.getElementById('yearFilter').style.display =
                (tab === 'completed') ? 'block' : 'none';
            document.getElementById('chartContainer').style.display =
                (tab === 'completed') ? 'block' : 'none';

            if (tab === 'completed') {
                updateYearFilter();
                renderChart();
            }
        }

        function initEventListeners() {
            // 标签切换
            var tabs = document.querySelectorAll('.tab');
            tabs.forEach(function(tab) {
                tab.addEventListener('click', function() {
                    tabs.forEach(function(t) { t.classList.remove('active'); });
                    tab.classList.add('active');
                    currentTab = tab.dataset.tab;
                    document.getElementById('sectionTitle').textContent = planTypeNames[currentTab];
                    applyTabUI(currentTab);
                    renderPlans();
                });
            });

            // 年份 / 月份筛选
            ['yearSelect', 'monthSelect'].forEach(function(id) {
                document.getElementById(id).addEventListener('change', function() {
                    renderPlans();
                    if (document.getElementById('chartContainer').style.display !== 'none') renderChart();
                });
            });

            // 周计划状态筛选 + 视觉联动
            var filterColors = {
                statusPending:    { border: '#9e9e9e', bg: '#f5f5f5', dot: '#9e9e9e' },
                statusInProgress: { border: '#4caf50', bg: '#e8f5e9', dot: '#4caf50' },
                statusPaused:     { border: '#ff9800', bg: '#fff3e0', dot: '#ff9800' },
                showNextWeek:     { border: '#1976d2', bg: '#e3f2fd', dot: '#1976d2' }
            };

            function updateFilterStyle(id) {
                var checkbox = document.getElementById(id);
                var label = document.getElementById('label-' + id);
                if (!checkbox || !label) return;
                var color = filterColors[id];
                if (checkbox.checked) {
                    label.style.background = color.bg;
                    label.style.borderColor = color.border;
                    label.style.opacity = '1';
                } else {
                    label.style.background = '#fafafa';
                    label.style.borderColor = '#e0e0e0';
                    label.style.opacity = '0.5';
                }
            }

            Object.keys(filterColors).forEach(function(id) {
                var checkbox = document.getElementById(id);
                if (!checkbox) return;
                updateFilterStyle(id);
                checkbox.addEventListener('change', function() {
                    updateFilterStyle(id);
                    renderPlans();
                });
            });

            // 图表显示 / 隐藏
            document.getElementById('toggleChartBtn').addEventListener('click', function(e) {
                var chartContainer = document.getElementById('chartContainer');
                var hidden = chartContainer.style.display === 'none';
                chartContainer.style.display = hidden ? 'block' : 'none';
                e.target.textContent = hidden ? '📊 隐藏统计图表' : '📊 显示统计图表';
                if (hidden) renderChart();
            });

            document.getElementById('addPlanBtn').addEventListener('click', function() { openModal(); });

            // 搜索（防抖）
            var searchTimer = null;
            document.getElementById('searchInput').addEventListener('input', function() {
                clearTimeout(searchTimer);
                searchTimer = setTimeout(renderPlans, 200);
            });
            document.getElementById('clearSearchBtn').addEventListener('click', function() {
                document.getElementById('searchInput').value = '';
                renderPlans();
            });

            document.getElementById('closeModalBtn').addEventListener('click', closeModal);
            document.getElementById('cancelBtn').addEventListener('click', closeModal);
            document.getElementById('planForm').addEventListener('submit', function(e) {
                e.preventDefault();
                savePlan();
            });
            document.getElementById('planType').addEventListener('change', function(e) {
                togglePersonnelFields(e.target.value);
            });

            // 计划卡片操作：编辑 / 删除 / 恢复 / 彻底删除（事件委托，替代内联 onclick）
            document.getElementById('planList').addEventListener('click', function(e) {
                var btn = e.target.closest('[data-action]');
                if (!btn) return;
                var handler = {
                    edit:    openModal,
                    delete:  deletePlan,
                    restore: restorePlan,
                    purge:   permanentDelete
                }[btn.dataset.action];
                if (handler) handler(btn.dataset.planId);
            });
        }

        /* ================================================================
         * 八、弹窗（新增 / 编辑）
         * ================================================================ */
        // 计划 id 归一：周计划中"来自月计划"的虚拟 id 形如 <真实id>_weekly
        function realIdOf(planId) {
            return (planId && planId.slice(-7) === '_weekly') ? planId.slice(0, -7) : planId;
        }

        function findPlanById(planId) {
            if (!planId) return null;
            return plans.find(function(p) { return p.id === planId; })
                || plans.find(function(p) { return p.id === realIdOf(planId); })
                || null;
        }

        function openModal(planId) {
            document.getElementById('planForm').reset();
            editingPlanId = planId || null;

            var plan = findPlanById(editingPlanId);
            if (plan) editingPlanId = plan.id;

            if (plan) {
                document.getElementById('modalTitle').textContent = '编辑计划';
                fillForm(plan);
            } else {
                document.getElementById('modalTitle').textContent = '新增计划';
                document.getElementById('planType').value = currentTab;
            }

            togglePersonnelFields(document.getElementById('planType').value);
            setCompletedEditMode(!!(plan && plan.status === 'completed'));
            document.getElementById('planModal').classList.add('show');
        }

        // 把计划数据回填到表单
        function fillForm(plan) {
            var set = function(id, value) {
                document.getElementById(id).value = (value === undefined || value === null) ? '' : value;
            };

            set('planType', plan.type);
            set('planContent', plan.content);
            set('workTicketNo', plan.workTicketNo);
            set('planNo', plan.planNo);
            set('ticketType', plan.ticketType);
            set('priority', plan.priority);
            set('status', plan.status);
            set('equipmentStatus', plan.equipmentStatus);
            setDateTime('start', plan.startDate);
            setDateTime('end', plan.endDate);

            // 立项名：新格式拆分「基础名 + 补充说明」，旧数据从标题中兼容解析
            if (plan.titleBase) {
                set('planTitle', plan.titleBase);
                set('planTitleSuffix', plan.titleSuffix);
            } else {
                var m = (plan.title || '').match(/^(.+?)\s*-\s*(.+)$/);
                set('planTitle', m ? m[1] : plan.title);
                set('planTitleSuffix', m ? m[2] : '');
            }

            // 人员信息仅在周计划 / 月计划下回填
            if (plan.type === 'weekly' || plan.type === 'monthly') {
                set('responsible', plan.responsible);
                set('members', plan.members);
                for (var gi = 1; gi <= 5; gi++) {
                    set('group' + gi + 'Leader', plan['group' + gi + 'Leader']);
                    set('group' + gi + 'Members', plan['group' + gi + 'Members']);
                }
                set('ticketPersonnel', plan.ticketPersonnel);
                set('fireWorkLeader', plan.fireWorkLeader);
                set('fireWorkExecutor', plan.fireWorkExecutor);
                set('fireWorkGuardian', plan.fireWorkGuardian);
            }
        }

        // 填充「日期 + 时 + 分」三个输入框
        function setDateTime(prefix, dateTimeStr) {
            var d = dateTimeStr ? new Date(dateTimeStr) : new Date();
            document.getElementById(prefix + 'Date').value   = formatDateForInput(d);
            document.getElementById(prefix + 'Hour').value   = d.getHours();
            document.getElementById(prefix + 'Minute').value = pad2(d.getMinutes());
        }

        function closeModal() {
            document.getElementById('planModal').classList.remove('show');
            setCompletedEditMode(false);
            editingPlanId = null;
        }

        // 已完结计划：仅保留票号 / 计划编号 / 状态可编辑
        function setCompletedEditMode(enable) {
            var lockedFields = [
                'planType', 'planTitle', 'planTitleSuffix', 'planContent',
                'startDate', 'startHour', 'startMinute',
                'endDate', 'endHour', 'endMinute',
                'ticketType', 'equipmentStatus', 'priority',
                'responsible', 'members',
                'group1Leader', 'group1Members', 'group2Leader', 'group2Members',
                'group3Leader', 'group3Members', 'group4Leader', 'group4Members',
                'group5Leader', 'group5Members',
                'ticketPersonnel', 'fireWorkLeader', 'fireWorkExecutor', 'fireWorkGuardian'
            ];
            var editableFields = ['workTicketNo', 'planNo', 'status'];
            var hint = document.getElementById('completedEditHint');

            // 锁定字段在只读模式下禁用，可编辑字段（票号 / 计划编号 / 状态）始终可用
            lockedFields.concat(editableFields).forEach(function(id) {
                var el = document.getElementById(id);
                if (el) el.disabled = enable && lockedFields.indexOf(id) !== -1;
            });
            if (hint) hint.style.display = enable ? 'flex' : 'none';
            if (enable) document.getElementById('modalTitle').textContent = '编辑已完结计划';
        }

        // 按计划类型显示 / 隐藏人员信息
        function togglePersonnelFields(planType) {
            var show = (planType === 'weekly' || planType === 'monthly');
            document.getElementById('personnelFields').style.display = show ? 'block' : 'none';
        }

        /* ================================================================
         * 九、保存
         * ================================================================ */
        function savePlan() {
            var val = function(id) { return document.getElementById(id).value; };

            var titleBase   = val('planTitle');
            var titleSuffix = val('planTitleSuffix');
            var startDate = new Date(val('startDate') + 'T' + pad2(val('startHour')) + ':' + pad2(val('startMinute')));
            var endDate   = new Date(val('endDate')   + 'T' + pad2(val('endHour'))   + ':' + pad2(val('endMinute')));

            var existing = findPlanById(editingPlanId);
            var plan = {
                id:               (existing && existing.id) || realIdOf(editingPlanId) || String(Date.now()),
                type:             val('planType'),
                title:            titleSuffix ? titleBase + ' - ' + titleSuffix : titleBase,
                titleBase:        titleBase,
                titleSuffix:      titleSuffix,
                content:          val('planContent'),
                workTicketNo:     val('workTicketNo'),
                planNo:           val('planNo'),
                startDate:        startDate.toISOString(),
                endDate:          endDate.toISOString(),
                ticketType:       val('ticketType'),
                priority:         val('priority'),
                status:           val('status'),
                equipmentStatus:  val('equipmentStatus'),
                responsible:      val('responsible'),
                members:          val('members'),
                ticketPersonnel:  val('ticketPersonnel'),
                fireWorkLeader:   val('fireWorkLeader'),
                fireWorkExecutor: val('fireWorkExecutor'),
                fireWorkGuardian: val('fireWorkGuardian'),
                isTransferred:    existing ? !!existing.isTransferred : false,
                transferredAt:    existing ? (existing.transferredAt || null) : null
            };
            for (var gi = 1; gi <= 5; gi++) {
                plan['group' + gi + 'Leader']  = val('group' + gi + 'Leader');
                plan['group' + gi + 'Members'] = val('group' + gi + 'Members');
            }

            // 类型联动：编辑时尊重用户选择；新建时若时间超出本周/下周则降级为月计划
            var isNew = !editingPlanId;
            var inWeekRange = isInCurrentWeek(plan.startDate) || isInNextWeek(plan.startDate);

            if (isNew && plan.type === 'weekly' && !inWeekRange) {
                plan.type = 'monthly';
            }
            if (plan.type === 'weekly') {
                plan.isTransferred = false;
                plan.transferredAt = null;
            } else if (!isNew && plan.isTransferred && !inWeekRange) {
                plan.isTransferred = false;
                plan.transferredAt = null;
            }

            savePlanToCloud(plan)
                .then(function() {
                    closeModal();
                    loadPlans();
                })
                .catch(function(error) {
                    console.error('保存失败:', error);
                    alert('保存失败: ' + error.message);
                    setSyncStatus('error', '保存失败');
                });
        }

        /* ================================================================
         * 十、删除 / 恢复
         * ================================================================ */
        // 通用确认对话框
        function showConfirmDialog(modalId, confirmBtnId, cancelBtnId, onConfirm) {
            var modal = document.getElementById(modalId);

            // 克隆按钮以清除上一次绑定的监听
            [confirmBtnId, cancelBtnId].forEach(function(id) {
                var oldBtn = document.getElementById(id);
                oldBtn.parentNode.replaceChild(oldBtn.cloneNode(true), oldBtn);
            });

            modal.classList.add('show');
            document.getElementById(cancelBtnId).addEventListener('click', function() {
                modal.classList.remove('show');
            });
            document.getElementById(confirmBtnId).addEventListener('click', function() {
                modal.classList.remove('show');
                onConfirm();
            });
        }

        function deletePlan(planId) {
            var realId = realIdOf(planId);
            if (!realId) { alert('无法获取计划ID，请刷新页面后重试。'); return; }
            if (!supabaseClient) { alert('未连接到数据库，请检查网络连接后刷新页面。'); return; }

            showConfirmDialog('deleteConfirmModal', 'deleteConfirmBtn', 'deleteCancelBtn', function() {
                setSyncStatus('syncing', '处理中...');
                applyLocal(realId, { isDeleted: true, deletedAt: new Date().toISOString() });
                deletePlanFromCloud(realId)
                    .then(function() { loadPlans(); })
                    .catch(function(error) {
                        applyLocal(realId, { isDeleted: false, deletedAt: null });
                        console.error('移入回收站失败:', error);
                        alert('移入回收站失败: ' + error.message);
                        setSyncStatus('error', '操作失败');
                    });
            });
        }

        function restorePlan(planId) {
            showConfirmDialog('restoreConfirmModal', 'restoreConfirmBtn', 'restoreCancelBtn', function() {
                setSyncStatus('syncing', '恢复中...');
                restorePlanFromTrash(planId)
                    .then(function() { loadPlans(); })
                    .catch(function(error) {
                        console.error('恢复失败:', error);
                        alert('恢复失败: ' + error.message);
                        setSyncStatus('error', '恢复失败');
                    });
            });
        }

        function permanentDelete(planId) {
            showConfirmDialog('permanentDeleteModal', 'permanentDeleteConfirmBtn', 'permanentDeleteCancelBtn', function() {
                setSyncStatus('syncing', '删除中...');
                permanentDeletePlan(planId)
                    .then(function() { loadPlans(); })
                    .catch(function(error) {
                        console.error('永久删除失败:', error);
                        alert('永久删除失败: ' + error.message);
                        setSyncStatus('error', '删除失败');
                    });
            });
        }

        /* ================================================================
         * 十一、渲染
         * ================================================================ */
        function renderPlans() {
            var container = document.getElementById('planList');
            var keyword = document.getElementById('searchInput').value.toLowerCase().trim();
            var html;

            // 回收站
            if (currentTab === 'trash') {
                var trash = plans.filter(function(p) { return p.isDeleted; });
                if (keyword) trash = trash.filter(function(p) { return buildSearchText(p).indexOf(keyword) !== -1; });
                trash.sort(function(a, b) {
                    return new Date(b.deletedAt || b.updatedAt) - new Date(a.deletedAt || a.updatedAt);
                });
                html = trash.length
                    ? trash.map(trashCardHtml).join('')
                    : '<div class="empty-state"><p style="font-size:1.2em;">🗑️ 回收站为空</p>' +
                      '<p style="margin-top:10px; color:var(--text-muted);">删除的计划会在这里显示</p></div>';
            } else {
                var list = selectPlansForTab(currentTab, keyword);
                if (!list.length) {
                    html = '<div class="empty-state"><p>暂无' + planTypeNames[currentTab] +
                        '，点击"新增计划"开始创建</p></div>';
                } else {
                    var now = new Date();
                    html = list.map(function(plan) { return planCardHtml(plan, now); }).join('');
                }
            }

            if (localMode) html = localModeBanner() + html;

            // 渲染结果一致就不碰 DOM。否则每次轮询/实时回读都会重建 innerHTML，
            // 触发 .plan-card 的 fadeInUp 动画重播 —— 表现就是"界面一直在刷新"。
            if (html === lastListHtml) return;
            lastListHtml = html;
            container.innerHTML = html;

            // 提示条上的「重试连接云端」按钮
            if (localMode) {
                var rb = document.getElementById('retryCloudBtn');
                if (rb) rb.onclick = function() { retryCloud(); };
            }
        }

        // 按标签页 + 关键词筛选（回收站分支在上层单独处理）
        function selectPlansForTab(tab, keyword) {
            var list;

            if (tab === 'completed') {
                var year  = document.getElementById('yearSelect').value;
                var month = document.getElementById('monthSelect').value;
                list = plans.filter(function(p) {
                    if (p.isDeleted || p.status !== 'completed') return false;
                    var d = new Date(p.endDate);
                    if (year  && d.getFullYear()  !== parseInt(year))  return false;
                    if (month && d.getMonth() + 1 !== parseInt(month)) return false;
                    return true;
                });

            } else if (tab === 'weekly') {
                var fPending    = document.getElementById('statusPending').checked;
                var fInProgress = document.getElementById('statusInProgress').checked;
                var fPaused     = document.getElementById('statusPaused').checked;
                var fNextWeek   = document.getElementById('showNextWeek').checked;

                list = plans.filter(function(p) {
                    if (p.isDeleted || p.status === 'completed') return false;
                    var isWeekly = p.type === 'weekly';
                    var isTransferred = p.type === 'monthly' && p.isTransferred;
                    if (!isWeekly && !isTransferred) return false;
                    if (fNextWeek) return isInNextWeek(p.startDate);
                    return (p.status === 'pending'     && fPending)
                        || (p.status === 'in-progress' && fInProgress)
                        || (p.status === 'paused'      && fPaused);
                }).map(function(p) {
                    // 已转移月计划挂虚拟 ID，便于编辑 / 删除时回溯来源
                    return (p.type === 'monthly' && p.isTransferred)
                        ? Object.assign({}, p, { id: p.id + '_weekly', sourceId: p.id, _fromMonthly: true })
                        : p;
                });

            } else {
                list = plans.filter(function(p) {
                    return !p.isDeleted && p.status !== 'completed' && !p.isTransferred && p.type === tab;
                });
            }

            if (keyword) {
                list = list.filter(function(p) { return buildSearchText(p).indexOf(keyword) !== -1; });
            }
            return list.sort(function(a, b) { return new Date(a.startDate) - new Date(b.startDate); });
        }

        // 计划的时间派生信息（统一计算，避免渲染期重复推算）
        function planTiming(plan, now) {
            var end = plan.endDate ? new Date(plan.endDate) : null;
            var finished = plan.status === 'completed' || !!(end && end < now);
            var days = Math.ceil((new Date(plan.startDate) - now) / 86400000);
            var urgency = finished ? '' :
                          days <= 3  ? 'urgent' :
                          days <= 7  ? 'near'   :
                          days <= 30 ? 'normal' : 'far';
            return { finished: finished, days: days, urgency: urgency };
        }

        function daysBadgeHtml(timing) {
            if (timing.finished) return '';
            if (timing.days <= 0) return '<span class="badge badge-urgent badge-sm">进行中</span>';
            var cls = timing.days <= 3 ? 'badge-warn3' : timing.days <= 7 ? 'badge-warn7' : 'badge-far';
            return '<span class="badge ' + cls + ' badge-sm">' + timing.days + '天后</span>';
        }

        function statusBadgeHtml(plan) {
            // 已完结页不重复提示"已完成"，仅显示异常状态；其他页在"结束时间已过但状态未同步"时也显示已完成
            if (plan.status === 'completed') {
                return currentTab === 'completed' ? '' : getStatusText('completed');
            }
            return getStatusText(plan.status);
        }

        function planCardHtml(plan, now) {
            var timing = planTiming(plan, now);

            var personnelHtml = '';
            if (plan.responsible) personnelHtml += '<span class="badge badge-person">' + escapeHtml(plan.responsible) + '</span>';
            if (plan.members)     personnelHtml += '<span class="badge badge-members">' + escapeHtml(plan.members) + '</span>';

            var groupsHtml = '';
            for (var i = 1; i <= 5; i++) {
                var leader  = plan['group' + i + 'Leader'];
                var members = plan['group' + i + 'Members'];
                if (!leader && !members) continue;
                groupsHtml += '<div class="group-item"><div class="group-label">小组 ' + i + '</div>' +
                    (leader  ? '<div class="group-row group-row-leader">负责人：<span class="group-val">' + escapeHtml(leader) + '</span></div>' : '') +
                    (members ? '<div class="group-row group-row-member">组员：<span class="group-val">' + escapeHtml(members) + '</span></div>' : '') +
                    '</div>';
            }

            var fireWorkHtml = '';
            if (plan.fireWorkLeader || plan.fireWorkExecutor || plan.fireWorkGuardian) {
                fireWorkHtml = '<div class="firework-block"><div class="firework-title">🔥 动火作业信息</div>' +
                    (plan.fireWorkLeader   ? '<div class="firework-row">负责人：<span class="group-val">' + escapeHtml(plan.fireWorkLeader) + '</span></div>' : '') +
                    (plan.fireWorkExecutor ? '<div class="firework-row">执行人：<span class="group-val">' + escapeHtml(plan.fireWorkExecutor) + '</span></div>' : '') +
                    (plan.fireWorkGuardian ? '<div class="firework-row">监护人：<span class="group-val">' + escapeHtml(plan.fireWorkGuardian) + '</span></div>' : '') +
                    '</div>';
            }

            var ticketPersonnelHtml = (plan.ticketPersonnel && plan.ticketPersonnel.trim())
                ? '<div class="ticket-person-block"><span style="color:var(--text-secondary);">📝 办票人员：</span>' +
                  '<span class="group-val">' + escapeHtml(plan.ticketPersonnel.trim()) + '</span></div>'
                : '';

            // 徽章行：下周 / 剩余天数 / 票型 / 票号 / 计划编号
            var badges = '';
            if (isInNextWeek(plan.startDate)) badges += '<span class="badge badge-next badge-sm">下周</span>';
            badges += daysBadgeHtml(timing);
            if (plan.ticketType)  badges += '<span class="badge badge-ticket">🎫 ' + escapeHtml(plan.ticketType) + '</span>';
            if (plan.workTicketNo) badges += '<span class="badge badge-work-no">🔖 ' + escapeHtml(plan.workTicketNo) + '</span>';
            if (plan.planNo)      badges += '<span class="badge badge-plan-no">📋 ' + escapeHtml(plan.planNo) + '</span>';

            return '<div class="plan-card ' + timing.urgency + '">' +
                /* 标题 + 操作 */
                '<div class="plan-title-row">' +
                    '<div class="plan-title">' + escapeHtml(plan.title) + '</div>' +
                    '<div class="plan-actions">' +
                        '<button class="action-btn edit-btn" data-action="edit" data-plan-id="' + escapeHtml(plan.id) + '">✏️ 编辑</button>' +
                        (currentTab !== 'completed'
                            ? '<button class="action-btn delete-btn" data-action="delete" data-plan-id="' + escapeHtml(plan.id) + '">🗑️ 删除</button>'
                            : '') +
                    '</div>' +
                '</div>' +
                /* 徽章行 */
                (badges ? '<div class="plan-badges">' + badges + '</div>' : '') +
                /* 元信息行：日期 + 状态 + 风险 + 设备 */
                '<div class="plan-meta">' +
                    '<span class="badge badge-date">📅 ' + formatDateTimeForDisplay(plan.startDate) + ' — ' + formatDateTimeForDisplay(plan.endDate) + '</span>' +
                    statusBadgeHtml(plan) +
                    getPriorityText(plan.priority) +
                    (plan.equipmentStatus ? getEquipmentStatusText(plan.equipmentStatus) : '') +
                '</div>' +
                /* 人员 */
                (personnelHtml ? '<div class="plan-meta" style="margin-top:6px;">' + personnelHtml + '</div>' : '') +
                /* 小组 */
                (groupsHtml ? '<div class="group-block">' + groupsHtml + '</div>' : '') +
                /* 工作内容（无内容时不渲染空盒子） */
                (plan.content ? '<div class="card-content">' + escapeHtml(plan.content) + '</div>' : '') +
                fireWorkHtml +
                ticketPersonnelHtml +
                '</div>';
        }

        function trashCardHtml(plan) {
            var typeLabel = plan.type === 'weekly' ? '周计划' : plan.type === 'monthly' ? '月计划' : '已完结';
            var deletedAt = plan.deletedAt ? formatDateTimeForDisplay(plan.deletedAt) : '未知时间';

            return '<div class="plan-card far" style="opacity:0.95;">' +
                '<div class="plan-title-row">' +
                    '<div style="flex:1;min-width:0;">' +
                        '<div class="plan-title" style="color:var(--text-muted);">' + escapeHtml(plan.title) +
                        ' <span class="badge badge-trash">' + typeLabel + '</span></div>' +
                        '<div class="plan-meta" style="margin-top:6px;">' +
                            '<span class="badge badge-trash-date">📅 ' + formatDateTimeForDisplay(plan.startDate) + ' — ' + formatDateTimeForDisplay(plan.endDate) + '</span>' +
                            '<span style="color:var(--text-muted);font-size:12.5px;">🗑️ 删除于 ' + deletedAt + '</span>' +
                        '</div>' +
                    '</div>' +
                    '<div class="plan-actions">' +
                        '<button class="action-btn" data-action="restore" data-plan-id="' + escapeHtml(plan.id) + '" style="background:#2e7d32;color:white;min-height:36px;">↩️ 恢复</button>' +
                        '<button class="action-btn" data-action="purge" data-plan-id="' + escapeHtml(plan.id) + '" style="background:#c62828;color:white;min-height:36px;">🗑️ 删除</button>' +
                    '</div>' +
                '</div>' +
                (plan.content ? '<div class="card-content" style="border-left-color:#9ca3af;">' + escapeHtml(plan.content) + '</div>' : '') +
                '</div>';
        }

        // 仅在数值变化时写 DOM，避免无意义的排版重算
        function setText(id, value) {
            var el = document.getElementById(id);
            if (el && el.textContent !== String(value)) el.textContent = value;
        }

        function updateStats() {
            var active = plans.filter(function(p) { return !p.isDeleted; });
            var count = function(fn) { return active.filter(fn).length; };

            setText('weeklyCount', count(function(p) {
                return (p.type === 'weekly' || (p.type === 'monthly' && p.isTransferred)) && p.status !== 'completed';
            }));
            setText('monthlyCount', count(function(p) {
                return p.type === 'monthly' && p.status !== 'completed' && !p.isTransferred;
            }));
            setText('completedCount', count(function(p) { return p.status === 'completed'; }));
            setText('totalCount', active.length);

            var trashCount = plans.filter(function(p) { return p.isDeleted; }).length;
            var trashBadge = document.getElementById('trashCount');
            if (trashBadge) {
                setText('trashCount', trashCount);
                var display = trashCount > 0 ? 'inline-block' : 'none';
                if (trashBadge.style.display !== display) trashBadge.style.display = display;
            }
        }

        /* ================================================================
         * 十二、徽章与文本工具
         * ================================================================ */
        function makeBadge(cls, text, bold) {
            return '<span class="bdg ' + cls + (bold ? ' bdg-bold' : '') + '">' + text + '</span>';
        }

        function getPriorityText(priority) {
            var m = {
                high:   ['bdg-risk-high',   '高风险', 1],
                medium: ['bdg-risk-medium', '中风险', 1],
                low:    ['bdg-risk-low',    '低风险', 1]
            };
            var v = m[priority] || ['bdg-risk-none', '普通', 0];
            return makeBadge(v[0], v[1], v[2]);
        }

        function getStatusText(status) {
            var m = {
                'pending':     ['bdg-status-pending',   '待开始'],
                'in-progress': ['bdg-status-progress',  '进行中'],
                'paused':      ['bdg-status-paused',    '间断中'],
                'completed':   ['bdg-status-completed', '已完成']
            };
            var v = m[status] || ['bdg-status-pending', '未知'];
            return makeBadge(v[0], v[1]);
        }

        function getEquipmentStatusText(status) {
            // "无设备"是默认值，本身不含信息，不渲染徽章以免每张卡片都挂一个灰点
            if (!status || status === 'none') return '';
            var m = {
                'none':        ['bdg-equip-none',        '无设备'],
                'not-arrived': ['bdg-equip-not-arrived', '未到货'],
                'pending':     ['bdg-equip-pending',     '待试验'],
                'testing':     ['bdg-equip-testing',     '试验中'],
                'tested':      ['bdg-equip-tested',      '已试验']
            };
            var v = m[status];
            return v ? makeBadge(v[0], v[1]) : '';
        }

        // 计划的搜索全文（关键词过滤）
        function buildSearchText(plan) {
            var fields = [
                plan.title, plan.content, plan.responsible, plan.members,
                plan.ticketType, plan.workTicketNo, plan.planNo,
                plan.ticketPersonnel, plan.fireWorkLeader,
                plan.fireWorkExecutor, plan.fireWorkGuardian
            ];
            for (var i = 1; i <= 5; i++) {
                fields.push(plan['group' + i + 'Leader']);
                fields.push(plan['group' + i + 'Members']);
            }
            return fields.filter(Boolean).join(' ').toLowerCase();
        }

        var escapeEl = document.createElement('div');
        function escapeHtml(text) {
            escapeEl.textContent = (text === undefined || text === null) ? '' : String(text);
            return escapeEl.innerHTML;
        }

        function pad2(n) { return String(n).padStart(2, '0'); }

        // 格式化为 date 输入框需要的 YYYY-MM-DD
        function formatDateForInput(date) {
            if (!date) return '';
            return date.getFullYear() + '-' + pad2(date.getMonth() + 1) + '-' + pad2(date.getDate());
        }

        // 格式化为 YYYY-MM-DD HH:mm
        function formatDateTimeForDisplay(dateTimeStr) {
            if (!dateTimeStr) return '';
            var date = new Date(dateTimeStr);
            return formatDateForInput(date) + ' ' + pad2(date.getHours()) + ':' + pad2(date.getMinutes());
        }

        /* ================================================================
         * 十三、周范围判断
         * ================================================================ */
        // offset=0 本周，offset=1 下周
        function getWeekRange(offset) {
            var now = new Date();
            var day = now.getDay();
            var monday = new Date(now);
            monday.setDate(now.getDate() - (day === 0 ? 6 : day - 1) + (offset || 0) * 7);
            monday.setHours(0, 0, 0, 0);
            var sunday = new Date(monday);
            sunday.setDate(monday.getDate() + 6);
            sunday.setHours(23, 59, 59, 999);
            return { start: monday, end: sunday };
        }

        // "YYYY-MM-DD" → 本地 Date
        function parseLocalDate(dateStr) {
            if (!dateStr) return null;
            var parts = dateStr.substring(0, 10).split('-');
            return new Date(+parts[0], parts[1] - 1, +parts[2]);
        }

        function isInWeek(dateStr, offset) {
            var range = getWeekRange(offset);
            var d = parseLocalDate(dateStr);
            return !!d && d >= range.start && d <= range.end;
        }
        function isInCurrentWeek(dateStr) { return isInWeek(dateStr, 0); }
        function isInNextWeek(dateStr)    { return isInWeek(dateStr, 1); }

        /* ================================================================
         * 十四、已完结统计（年份筛选 + 柱状图）
         * ================================================================ */
        function updateYearFilter() {
            var select = document.getElementById('yearSelect');
            var previous = select.value;                 // 刷新时保留用户已选年份

            var years = [];
            plans.forEach(function(plan) {
                if (plan.status !== 'completed') return;
                var y = new Date(plan.endDate).getFullYear();
                if (years.indexOf(y) === -1) years.push(y);
            });
            years.sort(function(a, b) { return b - a; });

            var html = '<option value="">全部年份</option>' +
                years.map(function(y) { return '<option value="' + y + '">' + y + '年</option>'; }).join('');
            if (select.innerHTML !== html) {
                select.innerHTML = html;
                if (previous && years.indexOf(parseInt(previous)) !== -1) select.value = previous;
            }
        }

        var lastChartKey = null;

        function renderChart() {
            var selectedYear  = document.getElementById('yearSelect').value;
            var selectedMonth = document.getElementById('monthSelect').value;

            var completed = plans.filter(function(plan) {
                if (plan.isDeleted || plan.status !== 'completed') return false;
                var d = new Date(plan.endDate);
                if (isNaN(d.getTime())) return false;
                if (selectedYear  && d.getFullYear()  !== parseInt(selectedYear))  return false;
                if (selectedMonth && d.getMonth() + 1 !== parseInt(selectedMonth)) return false;
                return true;
            });

            // 按立项名分组统计
            var stats = {};
            completed.forEach(function(plan) {
                var name = plan.titleBase || plan.title;
                stats[name] = (stats[name] || 0) + 1;
            });

            var names = Object.keys(stats);
            var key = selectedYear + '|' + selectedMonth + '|' + JSON.stringify(stats);
            if (key === lastChartKey) return;            // 数据一致，不重画
            lastChartKey = key;

            // 动态标题
            var suffix = [];
            if (selectedYear)  suffix.push(selectedYear + '年');
            if (selectedMonth) suffix.push(parseInt(selectedMonth) + '月');
            document.getElementById('chartTitle').textContent =
                (suffix.length ? suffix.join('') + ' · ' : '') + '已完结计划统计（按立项名）';

            var canvas = document.getElementById('chartCanvas');
            var legend = document.getElementById('chartLegend');

            if (!names.length) {
                canvas.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:200px;color:var(--text-muted);font-size:14px;">暂无已完结计划数据</div>';
                legend.innerHTML = '';
                return;
            }

            var colors = ['#1e3a5f', '#2c5282', '#1565c0', '#0d47a1', '#2e7d32',
                          '#388e3c', '#455a64', '#546e7a', '#6a1b9a', '#bf360c'];
            var max = Math.max.apply(null, names.map(function(n) { return stats[n]; })) || 1;

            var bars = '';
            var legendHtml = '';
            names.forEach(function(name, index) {
                var count = stats[name];
                var color = colors[index % colors.length];
                var height = Math.max((count / max) * 220, 8);   // 最高 220px，最低 8px
                bars += '<div class="chart-bar">' +
                    '<div class="chart-bar-value" style="height:' + height + 'px;background:' + color + ';">' +
                        '<div class="chart-bar-count">' + count + '</div>' +
                    '</div>' +
                    '<div class="chart-bar-label" title="' + name + '">' + name + '</div>' +
                    '</div>';
                legendHtml += '<div class="legend-item">' +
                    '<div class="legend-color" style="background:' + color + ';"></div>' +
                    '<span>' + name + ': ' + count + '个</span>' +
                    '</div>';
            });

            canvas.innerHTML = '<div class="chart-container">' + bars + '</div>';
            legend.innerHTML = legendHtml;
        }

        /* ================================================================
         * 十五、连接自检
         *   用法：在网址后面加 ?diag=1 后刷新，页面底部会显示一份诊断报告。
         *   把报告复制给助手即可精确定位同步失败原因。
         * ================================================================ */
        function httpProbe(path, options) {
            var config = {
                headers: {
                    apikey: DB_CONFIG.key,
                    Authorization: 'Bearer ' + DB_CONFIG.key,
                    'Content-Type': 'application/json',
                    Accept: 'application/json'
                }
            };
            if (options) {
                if (options.method) config.method = options.method;
                if (options.body) config.body = options.body;
                if (options.headers) {
                    Object.keys(options.headers).forEach(function(k) {
                        config.headers[k] = options.headers[k];
                    });
                }
            }
            return fetch(DB_CONFIG.url + path, config)
                .then(function(r) {
                    return r.text().then(function(t) { return { status: r.status, body: t || '' }; });
                })
                .catch(function(e) {
                    return { status: 0, body: 'FETCH FAILED: ' + (e && e.message) };
                });
        }

        function runDiagnostics() {
            var log = [];
            function say(line) { log.push(line); console.log('[diag] ' + line); }

            say('===== 工作计划 · 连接自检 =====');
            say('时间: ' + new Date().toLocaleString());
            say('页面来源: ' + (typeof location !== 'undefined'
                ? location.protocol + '//' + (location.host || '(无主机)')
                : 'unknown'));
            if (isFileOrigin()) {
                say('  [i] 当前是「本地文件」方式打开（源为 null）。多数浏览器下仍能正常');
                say('      连库；若下面第 [1] 步显示请求没发出去，再改用 http:// 方式。');
            }
            say('URL : ' + DB_CONFIG.url);

            var key = DB_CONFIG.key;
            say('KEY : ' + key.slice(0, 24) + ' ... ' + key.slice(-8) + ' (长度 ' + key.length + ')');

            // 解析 anon key，确认是否过期、项目是否对得上
            try {
                var seg = key.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
                seg += '='.repeat((4 - seg.length % 4) % 4);
                var payload = JSON.parse(decodeURIComponent(escape(atob(seg))));
                say('KEY : ref=' + payload.ref + '  role=' + payload.role +
                    '  签发=' + new Date(payload.iat * 1000).toLocaleString() +
                    '  过期=' + new Date(payload.exp * 1000).toLocaleString());
                var urlRef = DB_CONFIG.url.split('//')[1].split('.')[0];
                say('匹配: URL 的 ref=' + urlRef +
                    (urlRef === payload.ref ? '  [OK] 与 key 一致' : '  [X] 与 key 不一致，key 属于别的项目'));
                say('过期: ' + (payload.exp * 1000 < Date.now() ? '[X] key 已过期' : '[OK] 未过期'));
            } catch (e) {
                say('KEY : [X] 解析失败（' + e.message + '），key 可能不是合法 JWT');
            }

            var results = { table: null, missing: [], write: null, delete: null };

            say('');
            say('[1] 整表读取测试（select=id，limit=1）');

            httpProbe('/rest/v1/plans?select=id&limit=1').then(function(res) {
                results.table = res;
                var code = res.status;
                say('    结果: HTTP ' + code);
                if (code === 0) {
                    say('    [X] 请求没发出去 → 手机没联网，或公司/宿舍网络拦截了 supabase.co');
                } else if (code === 200) {
                    say('    [OK] 网络与鉴权正常，plans 表可访问');
                } else if (code === 401 || code === 403) {
                    say('    [X] key 被拒绝 → anon key 可能已轮换，去 Supabase → Settings → API 复制新的');
                } else if (code === 404) {
                    say('    [X] 找不到 plans 表 → 确认表名是否为 plans、URL 是否为当前项目');
                } else {
                    say('    [X] 异常状态码，原始响应如下');
                }
                say('    原始: ' + res.body.slice(0, 300));

                say('');
                say('[2] 逐列校验（前端查询清单共 ' + COLS.length + ' 列）');
                return COLS.reduce(function(prev, col) {
                    return prev.then(function() {
                        return httpProbe('/rest/v1/plans?select=' + col + '&limit=1')
                            .then(function(r) {
                                if (r.status !== 200) {
                                    results.missing.push(col);
                                    say('    [X] 缺失列: ' + col + '  (HTTP ' + r.status + ') ' + r.body.slice(0, 140));
                                }
                            });
                    });
                }, Promise.resolve());
            }).then(function() {
                say('    ' + (results.missing.length ? '缺失列共 ' + results.missing.length + ' 个，需执行 database-schema.sql'
                                                     : '[OK] 全部 ' + COLS.length + ' 列都存在'));
                say('');
                say('[3] 写入权限测试（插入一条探测数据后立即删除）');
                return httpProbe('/rest/v1/plans', {
                    method: 'POST',
                    body: JSON.stringify({
                        id: 'diag-probe-000', type: 'weekly', title: '__probe__',
                        content: '', priority: 'low', status: 'pending',
                        // start_date / end_date 在库里是 NOT NULL，不带上会被约束拦下，
                        // 造成"没有写入权限"的误报
                        start_date: '2000-01-01T00:00:00', end_date: '2000-01-01T00:00:00'
                    }),
                    headers: { Prefer: 'return=minimal' }
                });
            }).then(function(res) {
                results.write = res.status;
                say('    写入 -> HTTP ' + res.status);
                if (res.status === 200 || res.status === 201 || res.status === 204) {
                    say('    [OK] 有写入权限');
                } else {
                    say('    [X] 写入被拒绝：多半是 RLS 策略没放开，执行 fix-permissions.sql，或临时关闭 RLS');
                    say('    原始: ' + res.body.slice(0, 300));
                }
                return httpProbe('/rest/v1/plans?id=eq.diag-probe-000', { method: 'DELETE' });
            }).then(function(res) {
                results.delete = res.status;
                say('    清理探测数据 -> HTTP ' + res.status +
                    ((res.status === 200 || res.status === 204) ? '  [OK] 已删除' : '  [!] 需手动删除 id=diag-probe-000'));
                say('');
                say('[4] SDK 加载: ' + (supabaseClient ? '[OK] 已加载' : '[X] 未加载（CDN 全部失败？）') +
                    (sdkSource ? '   通道=' + sdkSource : ''));
                say('[5] 实时通道: ' + (realtimeSubscribed ? '[OK] 已订阅' : '[!] 未订阅（已自动降级为定时轮询兜底）'));
                say('[6] 当前查询模式: ' + (selectColumns === '*' ? '*（取全部列，默认）' : '显式列清单'));
                say('');
                say('===== 请把以上全部内容复制发给助手 =====');
                showDiag(log);
            }).catch(function(e) {
                say('自检过程出错: ' + (e && e.message));
                showDiag(log);
            });
        }

        /* ================================================================
         * 十六、运行环境提示
         *   以 file:// 直接打开时页面源为 null。云端网关跨域策略是 *，
         *   多数浏览器下请求照常可通，因此不阻断；只有在请求根本发不出去
         *   （网络层失败）且当前是 file:// 时，才把这个可能性写进提示。
         * ================================================================ */
        function isFileOrigin() {
            return typeof location !== 'undefined' && location.protocol === 'file:';
        }

        // 网络层失败（请求没发出去 / 被掐断）时的补充线索
        function fileOriginHint() {
            return isFileOrigin()
                ? '另外：当前是「本地文件」方式打开（file://），个别浏览器或安全软件会拦截这类请求。' +
                  '可改为在本目录执行 npx http-server -p 3000 -c-1 --cors，再用命令行显示的地址打开。'
                : '';
        }

        function showDiag(log) {
            try {
                var box = document.createElement('div');
                box.style.cssText = 'position:fixed;left:0;right:0;bottom:0;max-height:60vh;overflow:auto;' +
                    'z-index:99999;background:#ffffff;color:#16202b;border-top:3px solid #1565c0;' +
                    'padding:14px 16px;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.75;' +
                    'box-shadow:0 -2px 16px rgba(0,0,0,0.15);';
                box.textContent = log.join('\n');
                document.body.appendChild(box);
            } catch (e) { /* 无 DOM 环境时忽略 */ }
        }
        })();
    </script>
