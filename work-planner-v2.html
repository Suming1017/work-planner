        function initTabs() {
            applyTabUI(currentTab);
        }

        function openModal(planId) {
            var modal = document.getElementById('planModal');
            var form = document.getElementById('planForm');
            var title = document.getElementById('modalTitle');

            form.reset();
            editingPlanId = planId;

            if (planId) {
                var plan = plans.find(function(p) { return p.id === planId; });
                // 如果没找到（比如是周计划中的来自月计划的记录），尝试查找原始月计划
                if (!plan && planId && planId.endsWith('_weekly')) {
                    var sourceId = planId.replace('_weekly', '');
                    plan = plans.find(function(p) { return p.id === sourceId; });
                    // 如果找到原始月计划，设置编辑ID为原始ID
                    if (plan) {
                        editingPlanId = sourceId;
                    }
                }
                if (plan) {
                    title.textContent = '编辑计划';
                    document.getElementById('planId').value = plan.id;
                    document.getElementById('planType').value = plan.type;

                    // 填充标题（如果是新的格式，拆分标题和补充说明；旧格式兼容）
                    if (plan.titleBase) {
                        document.getElementById('planTitle').value = plan.titleBase;
                        document.getElementById('planTitleSuffix').value = plan.titleSuffix || '';
                    } else {
                        // 旧数据，尝试从标题中提取补充说明
                        var match = plan.title.match(/^(.+?)\s*-\s*(.+)$/);
                        if (match) {
                            document.getElementById('planTitle').value = match[1];
                            document.getElementById('planTitleSuffix').value = match[2];
                        } else {
                            document.getElementById('planTitle').value = plan.title;
                            document.getElementById('planTitleSuffix').value = '';
                        }
                    }

                    document.getElementById('planContent').value = plan.content;
                    document.getElementById('workTicketNo').value = plan.workTicketNo || '';
                    document.getElementById('planNo').value = plan.planNo || '';

                    // 填充开始时间
                    var startDateTime = new Date(plan.startDate);
                    document.getElementById('startDate').value = formatDateForInput(startDateTime);
                    document.getElementById('startHour').value = startDateTime.getHours();
                    document.getElementById('startMinute').value = String(startDateTime.getMinutes()).padStart(2, '0');

                    // 填充结束时间
                    var endDateTime = new Date(plan.endDate);
                    document.getElementById('endDate').value = formatDateForInput(endDateTime);
                    document.getElementById('endHour').value = endDateTime.getHours();
                    document.getElementById('endMinute').value = String(endDateTime.getMinutes()).padStart(2, '0');

                    document.getElementById('ticketType').value = plan.ticketType || '';
                    document.getElementById('priority').value = plan.priority;
                    document.getElementById('status').value = plan.status;
                    document.getElementById('equipmentStatus').value = plan.equipmentStatus || '';

                    // 只在周计划和月计划时填充人员信息
                    if (plan.type === 'weekly' || plan.type === 'monthly') {
                        document.getElementById('responsible').value = plan.responsible || '';
                        document.getElementById('members').value = plan.members || '';

                        for (var gi = 1; gi <= 5; gi++) {
                            document.getElementById('group' + gi + 'Leader').value = plan['group' + gi + 'Leader'] || '';
                            document.getElementById('group' + gi + 'Members').value = plan['group' + gi + 'Members'] || '';
                        }

                        document.getElementById('ticketPersonnel').value = plan.ticketPersonnel || '';
                        document.getElementById('fireWorkLeader').value = plan.fireWorkLeader || '';
                        document.getElementById('fireWorkExecutor').value = plan.fireWorkExecutor || '';
                        document.getElementById('fireWorkGuardian').value = plan.fireWorkGuardian || '';
                    }
                }
            } else {
                title.textContent = '新增计划';
                document.getElementById('planType').value = currentTab;
            }

            // 根据计划类型显示/隐藏人员字段
            togglePersonnelFields(document.getElementById('planType').value);

            modal.classList.add('show');
        }

        function closeModal() {
            document.getElementById('planModal').classList.remove('show');
            editingPlanId = null;
        }

        // 根据计划类型显示/隐藏人员字段
        function togglePersonnelFields(planType) {
            var personnelFields = document.getElementById('personnelFields');
            if (planType === 'weekly' || planType === 'monthly') {
                personnelFields.style.display = 'block';
            } else {
                personnelFields.style.display = 'none';
            }
        }

        function updateStats() {
            var activePlans = plans.filter(function(p) { return !p.isDeleted; });
            var weeklyCount = activePlans.filter(function(p) {
                // 周计划本身 + 已转移到周计划的月计划，均计入周计划统计
                return (p.type === 'weekly' || (p.type === 'monthly' && p.isTransferred))
                    && p.status !== 'completed';
            }).length;
            // 月计划统计：排除已转移到周计划的计划
            var monthlyCount = activePlans.filter(function(p) {
                return p.type === 'monthly'
                    && p.status !== 'completed'
                    && !p.isTransferred;
            }).length;
            var completedCount = activePlans.filter(function(p) { return p.status === 'completed'; }).length;
            var totalCount = activePlans.length;
            var trashCount = plans.filter(function(p) { return p.isDeleted; }).length;

            document.getElementById('weeklyCount').textContent = weeklyCount;
            document.getElementById('monthlyCount').textContent = monthlyCount;
            document.getElementById('completedCount').textContent = completedCount;
            document.getElementById('totalCount').textContent = totalCount;

            var trashBadge = document.getElementById('trashCount');
            if (trashBadge) {
                trashBadge.textContent = trashCount;
                trashBadge.style.display = trashCount > 0 ? 'inline-block' : 'none';
            }
        }

        function savePlan() {
            var getVal = function(id) { return document.getElementById(id).value; };

            var titleBase   = getVal('planTitle');
            var titleSuffix = getVal('planTitleSuffix');
            var fullTitle   = titleSuffix ? titleBase + ' - ' + titleSuffix : titleBase;

            // 合并开始/结束日期和时间
            var startDateTime = new Date(getVal('startDate') + 'T' +
                String(getVal('startHour')).padStart(2, '0') + ':' +
                String(getVal('startMinute')).padStart(2, '0'));
            var endDateTime   = new Date(getVal('endDate') + 'T' +
                String(getVal('endHour')).padStart(2, '0') + ':' +
                String(getVal('endMinute')).padStart(2, '0'));

            var groupFields = {};
            for (var gi = 1; gi <= 5; gi++) {
                groupFields['group' + gi + 'Leader']  = getVal('group' + gi + 'Leader');
                groupFields['group' + gi + 'Members'] = getVal('group' + gi + 'Members');
            }

            var planData = Object.assign({
                id:             editingPlanId || String(Date.now()),
                type:           getVal('planType'),
                title:          fullTitle,
                titleBase:      titleBase,
                titleSuffix:    titleSuffix,
                content:        getVal('planContent'),
                workTicketNo:   getVal('workTicketNo'),
                planNo:         getVal('planNo'),
                startDate:      startDateTime.toISOString(),
                endDate:        endDateTime.toISOString(),
                ticketType:     getVal('ticketType'),
                priority:       getVal('priority'),
                status:         getVal('status'),
                equipmentStatus:getVal('equipmentStatus'),
                responsible:    getVal('responsible'),
                members:        getVal('members'),
                ticketPersonnel:getVal('ticketPersonnel'),
                fireWorkLeader: getVal('fireWorkLeader'),
                fireWorkExecutor:getVal('fireWorkExecutor'),
                fireWorkGuardian:getVal('fireWorkGuardian'),
                createdAt:      new Date().toISOString(),
                updatedAt:      new Date().toISOString()
            }, groupFields);

            savePlanToCloud(planData)
                .then(function() {
                    closeModal();
                    loadPlans();
                })
                .catch(function(error) {
                    console.error('保存失败:', error);
                    alert('保存失败: ' + error.message);
                    setSyncStatus('error', '保存失败');
                });
        }

        // 补录票号弹窗
        function openTicketNoModal(planId) {
            var plan = plans.find(function(p) { return p.id === planId; });
            if (!plan) return;

            var modal = document.getElementById('ticketNoModal');
            document.getElementById('ticketNoModalTitle').textContent = plan.title;
            document.getElementById('ticketNoInput').value = plan.workTicketNo || '';
            document.getElementById('planNoInput').value = plan.planNo || '';
            modal.style.display = 'block';

            // 克隆按钮清除旧事件
            var saveBtn = document.getElementById('ticketNoSaveBtn');
            var cancelBtn = document.getElementById('ticketNoCancelBtn');
            var newSaveBtn = saveBtn.cloneNode(true);
            var newCancelBtn = cancelBtn.cloneNode(true);
            saveBtn.parentNode.replaceChild(newSaveBtn, saveBtn);
            cancelBtn.parentNode.replaceChild(newCancelBtn, cancelBtn);

            newCancelBtn.addEventListener('click', function() {
                modal.style.display = 'none';
            });

            newSaveBtn.addEventListener('click', function() {
                var workTicketNo = document.getElementById('ticketNoInput').value.trim();
                var planNo = document.getElementById('planNoInput').value.trim();

                setSyncStatus('syncing', '保存中...');
                supabaseClient.from('plans')
                    .update({
                        work_ticket_no: workTicketNo || null,
                        plan_no: planNo || null,
                        updated_at: new Date().toISOString()
                    })
                    .eq('id', planId)
                    .then(function(result) {
                        if (result.error) {
                            console.error('补录票号失败:', result.error);
                            alert('保存失败: ' + result.error.message);
                            setSyncStatus('error', '保存失败');
                            return;
                        }
                        // 更新本地数据
                        plan.workTicketNo = workTicketNo;
                        plan.planNo = planNo;
                        modal.style.display = 'none';
                        renderPlans();
                        setSyncStatus('connected', '已连接');
                    });
            });
        }

        function deletePlan(planId) {
            if (!planId) {
                alert('无法获取计划ID，请刷新页面后重试。');
                return;
            }
            if (!supabaseClient) {
                alert('未连接到数据库，请检查网络连接后刷新页面。');
                return;
            }

            // 月转周虚拟计划：id 带 _weekly 后缀，需还原真实 ID
            var realPlanId = planId.endsWith('_weekly')
                ? planId.replace(/_weekly$/, '')
                : planId;

            var modal = document.getElementById('deleteConfirmModal');
            modal.style.display = 'block';

            var confirmBtn = document.getElementById('deleteConfirmBtn');
            var cancelBtn = document.getElementById('deleteCancelBtn');

            // 克隆按钮以清除旧事件绑定
            var newConfirmBtn = confirmBtn.cloneNode(true);
            var newCancelBtn = cancelBtn.cloneNode(true);
            confirmBtn.parentNode.replaceChild(newConfirmBtn, confirmBtn);
            cancelBtn.parentNode.replaceChild(newCancelBtn, cancelBtn);

            newCancelBtn.addEventListener('click', function() {
                modal.style.display = 'none';
            });

            newConfirmBtn.addEventListener('click', function() {
                modal.style.display = 'none';
                setSyncStatus('syncing', '处理中...');

                // 乐观更新：立即修改本地 plans 数组，界面立刻响应
                var now = new Date().toISOString();
                plans.forEach(function(p) {
                    if (p.id === realPlanId) {
                        p.isDeleted = true;
                        p.deletedAt = now;
                    }
                });
                renderPlans();
                updateStats();

                // 再异步同步到云端
                deletePlanFromCloud(realPlanId)
                    .then(function() {
                        loadPlans(); // 确保与云端数据一致
                    })
                    .catch(function(error) {
                        // 回滚本地乐观更新
                        plans.forEach(function(p) {
                            if (p.id === realPlanId) {
                                p.isDeleted = false;
                                p.deletedAt = null;
                            }
                        });
                        renderPlans();
                        updateStats();
                        console.error('操作失败:', error);
                        alert('移入回收站失败: ' + error.message);
                        setSyncStatus('error', '操作失败');
                    });
            });
        }

        function restorePlan(planId) {
            var modal = document.getElementById('restoreConfirmModal');
            modal.style.display = 'block';

            var confirmBtn = document.getElementById('restoreConfirmBtn');
            var cancelBtn = document.getElementById('restoreCancelBtn');

            var newConfirmBtn = confirmBtn.cloneNode(true);
            var newCancelBtn = cancelBtn.cloneNode(true);
            confirmBtn.parentNode.replaceChild(newConfirmBtn, confirmBtn);
            cancelBtn.parentNode.replaceChild(newCancelBtn, cancelBtn);

            newCancelBtn.addEventListener('click', function() {
                modal.style.display = 'none';
            });

            newConfirmBtn.addEventListener('click', function() {
                modal.style.display = 'none';
                setSyncStatus('syncing', '恢复中...');
                restorePlanFromTrash(planId)
                    .then(function() {
                        loadPlans();
                    })
                    .catch(function(error) {
                        console.error('恢复失败:', error);
                        alert('恢复失败: ' + error.message);
                        setSyncStatus('error', '恢复失败');
                    });
            });
        }

        function permanentDelete(planId) {
            var modal = document.getElementById('permanentDeleteModal');
            modal.style.display = 'block';

            var confirmBtn = document.getElementById('permanentDeleteConfirmBtn');
            var cancelBtn = document.getElementById('permanentDeleteCancelBtn');

            var newConfirmBtn = confirmBtn.cloneNode(true);
            var newCancelBtn = cancelBtn.cloneNode(true);
            confirmBtn.parentNode.replaceChild(newConfirmBtn, confirmBtn);
            cancelBtn.parentNode.replaceChild(newCancelBtn, cancelBtn);

            newCancelBtn.addEventListener('click', function() {
                modal.style.display = 'none';
            });

            newConfirmBtn.addEventListener('click', function() {
                modal.style.display = 'none';
                setSyncStatus('syncing', '删除中...');

                        loadPlans();

        function renderPlans() {
            var container = document.getElementById('planList');
            var filteredPlans;

            // 获取搜索关键词
            var searchKeyword = document.getElementById('searchInput').value.toLowerCase().trim();

            // 回收站标签：显示已删除的计划
            if (currentTab === 'trash') {
                filteredPlans = plans.filter(function(p) { return p.isDeleted; });

                // 搜索过滤
                if (searchKeyword) {
                    filteredPlans = filteredPlans.filter(function(plan) {
                        var searchText = (plan.title || '') + ' ' + (plan.content || '') + ' ' + (plan.responsible || '');
                        return searchText.toLowerCase().indexOf(searchKeyword) !== -1;
                    });
                }

                // 按删除时间降序
                filteredPlans.sort(function(a, b) {
                    return new Date(b.deletedAt || b.updatedAt) - new Date(a.deletedAt || a.updatedAt);
                });

                if (filteredPlans.length === 0) {
                    container.innerHTML = '<div class="empty-state"><p style="font-size:1.2em;">🗑️ 回收站为空</p><p style="margin-top:10px; color:#bbb;">删除的计划会在这里显示</p></div>';
                    return;
                }

                container.innerHTML = filteredPlans.map(function(plan) {
                    var deletedTimeStr = plan.deletedAt ? formatDateTimeForDisplay(plan.deletedAt) : '未知时间';
                    var typeLabel = plan.type === 'weekly' ? '周计划' : plan.type === 'monthly' ? '月计划' : '已完结';
                    return '<div class="plan-card far" style="opacity:0.85;">' +
                        '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;">' +
                        '<div style="flex:1;min-width:0;">' +
                        '<div class="plan-title" style="color:#888;">' + escapeHtml(plan.title) +
                        '<span class="badge badge-trash" style="margin-left:8px;">' + typeLabel + '</span>' +
                        '</div>' +
                        '<div class="plan-meta" style="margin-top:6px;">' +
                        '<span class="badge badge-trash-date">📅 ' + formatDateTimeForDisplay(plan.startDate) + ' 至 ' + formatDateTimeForDisplay(plan.endDate) + '</span>' +
                        '<span style="color:#bbb; font-size:12px;">🗑️ 删除于 ' + deletedTimeStr + '</span>' +
                        '</div>' +
                        '</div>' +
                        '<div style="display:flex;gap:8px;flex-shrink:0;">' +
                        '<button class="action-btn" style="background:linear-gradient(135deg,#43a047,#1b5e20);color:white;padding:7px 14px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;min-height:36px;" onclick="restorePlan(\'' + escapeHtml(plan.id) + '\')" title="恢复计划">↩️ 恢复</button>' +
                        '<button class="action-btn" style="background:linear-gradient(135deg,#b71c1c,#f44336);color:white;padding:7px 14px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;min-height:36px;" onclick="permanentDelete(\'' + escapeHtml(plan.id) + '\')" title="永久删除">🗑️ 永久删除</button>' +
                        '</div>' +
                        '</div>' +
                        '<div class="card-content" style="border-left-color:#9ca3af;">' + escapeHtml(plan.content) + '</div>' +
                        '</div>';
                }).join('');
                return;
            }

            // 已完结计划标签显示所有已完成的计划
            if (currentTab === 'completed') {
                var selectedYear = document.getElementById('yearSelect').value;
                var selectedMonth = document.getElementById('monthSelect').value;
                filteredPlans = plans.filter(function(p) {
                    if (p.isDeleted) return false;
                    if (p.status !== 'completed') return false;

                    var planDate = new Date(p.endDate);
                    var planYear = planDate.getFullYear();
                    var planMonth = planDate.getMonth() + 1; // getMonth() 返回 0-11

                    // 年份筛选
                    if (selectedYear && selectedYear !== '') {
                        if (planYear !== parseInt(selectedYear)) return false;
                    }

                    // 月份筛选
                    if (selectedMonth && selectedMonth !== '') {
                        if (planMonth !== parseInt(selectedMonth)) return false;
                    }

                    return true;
                });
            } else if (currentTab === 'weekly') {
                // 周计划：根据状态筛选（不包括已完成）
                var statusPending   = document.getElementById('statusPending').checked;
                var statusInProgress = document.getElementById('statusInProgress').checked;
                var statusPaused    = document.getElementById('statusPaused').checked;
                var showNextWeek    = document.getElementById('showNextWeek').checked;

                filteredPlans = plans.filter(function(p) {
                    if (p.isDeleted) return false;
                    if (p.status === 'completed') return false;
                    if (p.type !== currentTab) return false;

                    var isNextWeek = isInNextWeek(p.startDate);
                    if (showNextWeek) {
                        return isNextWeek;
                    }
                    return (p.status === 'pending'      && statusPending) ||
                           (p.status === 'in-progress'  && statusInProgress) ||
                           (p.status === 'paused'       && statusPaused);
                });

            } else {
                // 其他标签（月计划）显示对应类型的计划，排除已完成的
                filteredPlans = plans.filter(function(p) {
                    if (p.isDeleted) return false;
                    if (p.status === 'completed') return false;
                    if (p.type !== currentTab) return false;
                    // 已转移到周计划的月计划，永久不再在月计划中显示
                    if (currentTab === 'monthly' && p.isTransferred) return false;
                    return true;
                });
            }

            // 搜索过滤
            if (searchKeyword) {
                filteredPlans = filteredPlans.filter(function(plan) {
                    return buildSearchText(plan).indexOf(searchKeyword) !== -1;
                });
            }

            // 将已标记为转移的月计划纳入周计划显示（持久生效，无论今天是否周一）
            if (currentTab === 'weekly') {
                var showNextWeekFilter = document.getElementById('showNextWeek') ? document.getElementById('showNextWeek').checked : false;
                var statusPendingF = document.getElementById('statusPending').checked;
                var statusInProgressF = document.getElementById('statusInProgress').checked;
                var statusPausedF = document.getElementById('statusPaused').checked;

                var monthlyPlans = plans.filter(function(p) {
                    if (!( p.type === 'monthly' && !p.isDeleted && p.status !== 'completed' && p.isTransferred )) return false;
                    if (showNextWeekFilter) {
                        return isInNextWeek(p.startDate);
                    }
                    return (p.status === 'pending' && statusPendingF) ||
                           (p.status === 'in-progress' && statusInProgressF) ||
                           (p.status === 'paused' && statusPausedF);
                });

                // 对月转移计划同样应用搜索过滤
                if (searchKeyword) {
                    monthlyPlans = monthlyPlans.filter(function(plan) {
                        return buildSearchText(plan).indexOf(searchKeyword) !== -1;
                    });
                }

                monthlyPlans.forEach(function(monthlyPlan) {
                    // 检查是否已经有对应的周计划（通过源ID精确匹配，避免同名不同记录被误判）
                    var hasWeeklyPlan = filteredPlans.some(function(wp) {
                        return wp.sourceId === monthlyPlan.id && wp.sourceType === 'monthly';
                    });

                    if (!hasWeeklyPlan) {
                        // 从月计划复制所有字段，仅覆盖必要属性
                        var weeklyPlan = Object.assign({}, monthlyPlan, {
                            id: monthlyPlan.id + '_weekly',
                            type: 'weekly',
                            sourceType: 'monthly',
                            sourceId: monthlyPlan.id
                        });
                        filteredPlans.push(weeklyPlan);
                    }
                });
            }

            // 按开始时间从近到远排序
            filteredPlans.sort(function(a, b) {
                return new Date(a.startDate) - new Date(b.startDate);
            });

            // 计算每个计划距离今天的天数，并添加样式类
            var now = new Date();
            filteredPlans = filteredPlans.map(function(plan) {
                var startDate = new Date(plan.startDate);
                var endDate = plan.endDate ? new Date(plan.endDate) : null;
                var isFinished = plan.status === 'completed' || (endDate && endDate < now);

                var diffTime = startDate - now;
                var diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                // 添加样式类：已完成/结束时间已过 不再标为 urgent/near
                if (isFinished) {
                    plan.urgencyClass = 'plan-card'; // 正常样式，不突出
                } else if (diffDays <= 0) {
                    plan.urgencyClass = 'urgent'; // 今天或已开始
                } else if (diffDays <= 3) {
                    plan.urgencyClass = 'urgent'; // 3天内
                } else if (diffDays <= 7) {
                    plan.urgencyClass = 'near'; // 一周内
                } else if (diffDays <= 30) {
                    plan.urgencyClass = 'normal'; // 一月内
                } else {
                    plan.urgencyClass = 'far'; // 超过一个月
                }

                return plan;
            });

            if (filteredPlans.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>暂无' + planTypeNames[currentTab] + '，点击"新增计划"开始创建</p></div>';
                return;
            }
            
            container.innerHTML = filteredPlans.map(function(plan) {
                var personnelHtml = '';
                if (plan.responsible) {
                    personnelHtml += '<span class="badge badge-person">👤 ' + escapeHtml(plan.responsible) + '</span>';
                }
                if (plan.members) {
                    if (personnelHtml) personnelHtml += ' ';
                    personnelHtml += '<span class="badge badge-members">👥 ' + escapeHtml(plan.members) + '</span>';
                }

                // 显示小组信息
                var groupsHtml = '';
                for (var i = 1; i <= 5; i++) {
                    var leaderKey = 'group' + i + 'Leader';
                    var membersKey = 'group' + i + 'Members';

                    if (plan[leaderKey] || plan[membersKey]) {
                        var groupText = '<div class="group-item">';
                        groupText += '<div class="group-label">小组 ' + i + '</div>';
                        if (plan[leaderKey]) {
                            groupText += '<div class="group-row">👤 负责人：<span class="group-val">' + escapeHtml(plan[leaderKey]) + '</span></div>';
                        }
                        if (plan[membersKey]) {
                            groupText += '<div class="group-row">👥 组员：<span class="group-val">' + escapeHtml(plan[membersKey]) + '</span></div>';
                        }
                        groupText += '</div>';
                        groupsHtml += groupText;
                    }
                }

                // 显示票型
                var ticketHtml = '';
                if (plan.ticketType && plan.ticketType !== '') {
                    ticketHtml = '<span class="badge badge-ticket">🎫 ' + escapeHtml(plan.ticketType) + '</span>';
                }

                // 显示动火票信息
                var fireWorkHtml = '';
                if (plan.fireWorkLeader || plan.fireWorkExecutor || plan.fireWorkGuardian) {
                    fireWorkHtml = '<div class="firework-block">';
                    fireWorkHtml += '<div class="firework-title">🔥 动火作业信息</div>';
                    if (plan.fireWorkLeader) {
                        fireWorkHtml += '<div class="firework-row">负责人：<span class="group-val">' + escapeHtml(plan.fireWorkLeader) + '</span></div>';
                    }
                    if (plan.fireWorkExecutor) {
                        fireWorkHtml += '<div class="firework-row">执行人：<span class="group-val">' + escapeHtml(plan.fireWorkExecutor) + '</span></div>';
                    }
                    if (plan.fireWorkGuardian) {
                        fireWorkHtml += '<div class="firework-row">监护人：<span class="group-val">' + escapeHtml(plan.fireWorkGuardian) + '</span></div>';
                    }
                    fireWorkHtml += '</div>';
                }

                // 显示办票人员信息
                var ticketPersonnelHtml = '';
                if (plan.ticketPersonnel && plan.ticketPersonnel.trim()) {
                    ticketPersonnelHtml = '<div class="ticket-person-block">' +
                        '<span style="color:var(--text-secondary);">📝 办票人员：</span>' +
                        '<span class="group-val">' + escapeHtml(plan.ticketPersonnel.trim()) + '</span>' +
                        '</div>';
                }

                // 来源标记 & 下周计划标签
                var sourceTag = '';
                var cardClass = plan.urgencyClass || 'plan-card';
                var isNextWeekForTag = isInNextWeek(plan.startDate);
                if (isNextWeekForTag) {
                    sourceTag = '<span class="badge badge-next badge-sm">下周</span>';
                }

                // 计算剩余天数提示（考虑已完成/结束时间已过的情况）
                var daysBadge = '';
                var startDate = new Date(plan.startDate);
                var endDate = plan.endDate ? new Date(plan.endDate) : null;
                var isFinished = plan.status === 'completed' || (endDate && endDate < now);

                if (isFinished) {
                    // 已完成或结束时间已过，不显示"进行中"，改显示对应真实状态
                    daysBadge = '';
                } else {
                    var diffTime = startDate - now;
                    var diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                    if (diffDays <= 0) {
                        daysBadge = '<span class="badge badge-urgent badge-sm">进行中</span>';
                    } else if (diffDays <= 3) {
                        daysBadge = '<span class="badge badge-warn3 badge-sm">' + diffDays + '天后</span>';
                    } else if (diffDays <= 7) {
                        daysBadge = '<span class="badge badge-warn7 badge-sm">' + diffDays + '天后</span>';
                    } else {
                        daysBadge = '<span class="badge badge-far badge-sm">' + diffDays + '天后</span>';
                    }
                }

                // 状态徽章：实时反映真实状态
                // 在已完结标签页中，不重复显示"已完成"，仅显示非 completed 的异常状态
                // 在其他标签页中，若结束时间已过但状态未更新，也显示"已完成"
                var statusBadge = '';
                if (currentTab === 'completed') {
                    if (plan.status && plan.status !== 'completed') {
                        statusBadge = getStatusText(plan.status);
                    }
                } else {
                    // 结束时间已过，但数据库状态尚未同步完成时，也实时显示"已完成"
                    var effectiveStatus = plan.status;
                    if (endDate && endDate < now && effectiveStatus !== 'completed') {
                        effectiveStatus = 'completed';
                    }
                    if (effectiveStatus) {
                        statusBadge = getStatusText(effectiveStatus);
                    }
                }

                // 显示电气设备状态
                var equipmentBadge = '';
                if (plan.equipmentStatus) {
                    equipmentBadge = getEquipmentStatusText(plan.equipmentStatus);
                }

                return '<div class="' + cardClass + '">' +
                    '<div class="plan-header">' +
                    '<div style="flex:1;min-width:0;">' +
                    '<div style="display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:9px;">' +
                    '<span style="font-size:1.1em;font-weight:700;color:var(--text-primary);letter-spacing:0.2px;line-height:1.4;">' + escapeHtml(plan.title) + '</span>' +
                    sourceTag +
                    daysBadge +
                    ticketHtml +
                    (plan.workTicketNo ? '<span class="badge badge-work-no">🎫 ' + escapeHtml(plan.workTicketNo) + '</span>' : '') +
                    (plan.planNo ? '<span class="badge badge-plan-no">📋 ' + escapeHtml(plan.planNo) + '</span>' : '') +
                    '</div>' +
                    '<div class="plan-meta">' +
                    '<span class="badge badge-date">📅 ' + formatDateTimeForDisplay(plan.startDate) + ' — ' + formatDateTimeForDisplay(plan.endDate) + '</span>' +
                    '<span>' + getPriorityText(plan.priority) + '</span>' +
                    (equipmentBadge ? '<span>' + equipmentBadge + '</span>' : '') +
                    (statusBadge ? '<span>' + statusBadge + '</span>' : '') +
                    (personnelHtml ? '</div><div class="plan-meta" style="margin-top:7px;">' + personnelHtml : '') +
                    '</div>' +
                    (groupsHtml ? '<div class="group-block">' + groupsHtml + '</div>' : '') +
                    '</div>' +
                    '<div class="plan-actions">' +
                    (currentTab === 'completed' ? '<button class="action-btn" style="background:#f1f5f9;color:#475569;border:1px solid #cbd5e1;" data-ticket-plan-id="' + escapeHtml(plan.id) + '">✏️ 补录票号</button>' : '<button class="action-btn edit-btn" data-plan-id="' + escapeHtml(plan.id) + '">✏️ 编辑</button>') +
                    '<button class="action-btn delete-btn" data-plan-id="' + escapeHtml(plan.id) + '">🗑️ 删除</button>' +
                    '</div>' +
                    '</div>' +
                    '<div class="card-content">' + escapeHtml(plan.content) + '</div>' +
                    fireWorkHtml +
                    ticketPersonnelHtml +
                    '</div>';
            }).join('');
        }

        function getPriorityText(priority) {
            var texts = {
                high:   '<span style="background:#fef2f2;color:#dc2626;padding:3px 9px;border-radius:6px;font-size:11.5px;font-weight:700;border:1px solid #fecaca;">高风险</span>',
                medium: '<span style="background:#fff7ed;color:#ea580c;padding:3px 9px;border-radius:6px;font-size:11.5px;font-weight:700;border:1px solid #fed7aa;">中风险</span>',
                low:    '<span style="background:#f0fdf4;color:#16a34a;padding:3px 9px;border-radius:6px;font-size:11.5px;font-weight:700;border:1px solid #bbf7d0;">低风险</span>'
            };
            return texts[priority] || '<span style="background:#f9fafb;color:#6b7280;padding:3px 9px;border-radius:6px;font-size:11.5px;border:1px solid #e5e7eb;">普通</span>';
        }

        function getStatusText(status) {
            var texts = {
                pending:     '<span style="background:#f9fafb;color:#6b7280;padding:3px 9px;border-radius:6px;font-size:11.5px;font-weight:600;border:1px solid #e5e7eb;">待开始</span>',
                'in-progress': '<span style="background:#ecfdf5;color:#059669;padding:3px 9px;border-radius:6px;font-size:11.5px;font-weight:600;border:1px solid #a7f3d0;">进行中</span>',
                paused:      '<span style="background:#fffbeb;color:#d97706;padding:3px 9px;border-radius:6px;font-size:11.5px;font-weight:600;border:1px solid #fde68a;">间断中</span>',
                completed:   '<span style="background:#eff6ff;color:#2563eb;padding:3px 9px;border-radius:6px;font-size:11.5px;font-weight:600;border:1px solid #bfdbfe;">已完成</span>'
            };
            return texts[status] || '<span style="background:#f9fafb;color:#6b7280;padding:3px 9px;border-radius:6px;font-size:11.5px;border:1px solid #e5e7eb;">未知</span>';
        }

        function getEquipmentStatusText(status) {
            var texts = {
                'none':       '<span style="background:#f9fafb;color:#6b7280;padding:3px 9px;border-radius:6px;font-size:11.5px;font-weight:600;border:1px solid #e5e7eb;">无设备</span>',
                'not-arrived':'<span style="background:#fff1f2;color:#be123c;padding:3px 9px;border-radius:6px;font-size:11.5px;font-weight:600;border:1px solid #fecdd3;">未到货</span>',
                'pending':    '<span style="background:#fff7ed;color:#ea580c;padding:3px 9px;border-radius:6px;font-size:11.5px;font-weight:600;border:1px solid #fed7aa;">待试验</span>',
                'testing':    '<span style="background:#eff6ff;color:#2563eb;padding:3px 9px;border-radius:6px;font-size:11.5px;font-weight:600;border:1px solid #bfdbfe;">试验中</span>',
                'tested':     '<span style="background:#ecfdf5;color:#059669;padding:3px 9px;border-radius:6px;font-size:11.5px;font-weight:600;border:1px solid #a7f3d0;">已试验</span>'
            };
            return texts[status] || '<span style="background:#f9fafb;color:#6b7280;padding:3px 9px;border-radius:6px;font-size:11.5px;border:1px solid #e5e7eb;">未知</span>';
        }

        // 构建计划的搜索全文（用于关键词过滤）
        function buildSearchText(plan) {
            var fields = [
                plan.title, plan.content, plan.responsible, plan.members,
                plan.ticketType, plan.workTicketNo, plan.planNo,
                plan.ticketPersonnel, plan.fireWorkLeader,
                plan.fireWorkExecutor, plan.fireWorkGuardian
            ];
            for (var i = 1; i <= 5; i++) {
                fields.push(plan['group' + i + 'Leader']);
                fields.push(plan['group' + i + 'Members']);
            }
            return fields.filter(Boolean).join(' ').toLowerCase();
        }

        function escapeHtml(text) {
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 格式化日期为 date 输入框需要的格式 (YYYY-MM-DD)
        function formatDateForInput(date) {
            if (!date) return '';
            var year = date.getFullYear();
            var month = String(date.getMonth() + 1).padStart(2, '0');
            var day = String(date.getDate()).padStart(2, '0');
            return year + '-' + month + '-' + day;
        }

        // 格式化日期时间用于显示
        function formatDateTimeForDisplay(dateTimeStr) {
            if (!dateTimeStr) return '';
            var date = new Date(dateTimeStr);
            var year = date.getFullYear();
            var month = String(date.getMonth() + 1).padStart(2, '0');
            var day = String(date.getDate()).padStart(2, '0');
            var hours = String(date.getHours()).padStart(2, '0');
            var minutes = String(date.getMinutes()).padStart(2, '0');
            return year + '-' + month + '-' + day + ' ' + hours + ':' + minutes;
        }

        // 获取当前周的起始和结束日期
        function getCurrentWeekRange() {
            var now = new Date();
            var day = now.getDay();
            var monday = new Date(now);
            monday.setDate(now.getDate() - (day === 0 ? 6 : day - 1));
            monday.setHours(0, 0, 0, 0);

            var sunday = new Date(monday);
            sunday.setDate(monday.getDate() + 6);
            sunday.setHours(23, 59, 59, 999);

            return { start: monday, end: sunday };
        }

        // 获取下一周的起始和结束日期
        function getNextWeekRange() {
            var now = new Date();
            var day = now.getDay();
            var thisMonday = new Date(now);
            thisMonday.setDate(now.getDate() - (day === 0 ? 6 : day - 1));
            thisMonday.setHours(0, 0, 0, 0);

            // 下周一 = 本周一 + 7天
            var nextMonday = new Date(thisMonday);
            nextMonday.setDate(thisMonday.getDate() + 7);

            // 下周日 = 下周一 + 6天
            var nextSunday = new Date(nextMonday);
            nextSunday.setDate(nextMonday.getDate() + 6);
            nextSunday.setHours(23, 59, 59, 999);

            return { start: nextMonday, end: nextSunday };
        }

        // 将 "YYYY-MM-DD" 格式的日期字符串解析为本地时间的 Date 对象（避免UTC时区偏移）
        function parseLocalDate(dateStr) {
            if (!dateStr) return null;
            // 取前10位 "YYYY-MM-DD"，按本地时间解析
            var parts = dateStr.substring(0, 10).split('-');
            return new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]), 0, 0, 0, 0);
        }

        // 检查日期是否在当前周内
        function isInCurrentWeek(dateStr) {
            var weekRange = getCurrentWeekRange();
            var date = parseLocalDate(dateStr);
            if (!date) return false;
            return date >= weekRange.start && date <= weekRange.end;
        }

        // 检查日期是否在下一周内
        function isInNextWeek(dateStr) {
            var weekRange = getNextWeekRange();
            var date = parseLocalDate(dateStr);
            if (!date) return false;
            return date >= weekRange.start && date <= weekRange.end;
        }

        // 更新年份筛选器
        function updateYearFilter() {
            var yearSelect = document.getElementById('yearSelect');
            var completedPlans = plans.filter(function(p) { return p.status === 'completed'; });
            var years = [];

            completedPlans.forEach(function(plan) {
                var year = new Date(plan.endDate).getFullYear();
                if (years.indexOf(year) === -1) {
                    years.push(year);
                }
            });

            years.sort(function(a, b) { return b - a; }); // 降序排列

            yearSelect.innerHTML = '<option value="">全部年份</option>';
            years.forEach(function(year) {
                yearSelect.innerHTML += '<option value="' + year + '">' + year + '年</option>';
            });
        }

        // 渲染柱状图
        function renderChart() {
            var chartCanvas = document.getElementById('chartCanvas');
            var chartLegend = document.getElementById('chartLegend');

            var selectedYear = document.getElementById('yearSelect').value;
            var selectedMonth = document.getElementById('monthSelect').value;
            var completedPlans = plans.filter(function(p) {
                if (p.status !== 'completed') return false;
                if (p.isDeleted) return false;
                var planDate = new Date(p.endDate);
                if (isNaN(planDate.getTime())) return false;
                if (selectedYear && selectedYear !== '') {
                    if (planDate.getFullYear() !== parseInt(selectedYear)) return false;
                }
                if (selectedMonth && selectedMonth !== '') {
                    if (planDate.getMonth() + 1 !== parseInt(selectedMonth)) return false;
                }
                return true;
            });

            // 动态更新图表标题
            var titleParts = ['已完结计划统计（按立项名）'];
            var suffix = [];
            if (selectedYear && selectedYear !== '') suffix.push(selectedYear + '年');
            if (selectedMonth && selectedMonth !== '') suffix.push(parseInt(selectedMonth) + '月');
            if (suffix.length > 0) {
                titleParts = [suffix.join('') + ' · 已完结计划统计（按立项名）'];
            }
            var chartTitle = document.getElementById('chartTitle');
            if (chartTitle) chartTitle.textContent = titleParts[0];

            // 按立项名分组统计
            var projectStats = {};
            completedPlans.forEach(function(plan) {
                var titleBase = plan.titleBase || plan.title;
                if (!projectStats[titleBase]) {
                    projectStats[titleBase] = 0;
                }
                projectStats[titleBase]++;
            });

            var projects = Object.keys(projectStats);
            var counts = Object.values(projectStats);
            var maxCount = Math.max.apply(null, counts) || 1;

            // 颜色数组
            var colors = [
                '#667eea', '#764ba2', '#f093fb', '#f5576c',
                '#4facfe', '#00f2fe', '#43e97b', '#38f9d7',
                '#fa709a', '#fee140'
            ];

            // 生成柱状图HTML
            if (projects.length === 0) {
                chartCanvas.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:200px;color:var(--text-muted);font-size:14px;">暂无已完结计划数据</div>';
                chartLegend.innerHTML = '';
                return;
            }

            var chartHtml = '<div class="chart-container">';
            projects.forEach(function(project, index) {
                var count = projectStats[project];
                var height = Math.max((count / maxCount) * 220, 8); // 最大高度220px，最小8px
                var color = colors[index % colors.length];

                chartHtml += '<div class="chart-bar">' +
                    '<div class="chart-bar-value" style="height: ' + height + 'px; background: ' + color + ';">' +
                        '<div class="chart-bar-count">' + count + '</div>' +
                    '</div>' +
                    '<div class="chart-bar-label" title="' + project + '">' + project + '</div>' +
                    '</div>';
            });
            chartHtml += '</div>';

            chartCanvas.innerHTML = chartHtml;

            // 生成图例
            var legendHtml = '';
            projects.forEach(function(project, index) {
                var color = colors[index % colors.length];
                var count = projectStats[project];
                legendHtml += '<div class="legend-item">' +
                    '<div class="legend-color" style="background: ' + color + ';"></div>' +
                    '<span>' + project + ': ' + count + '个</span>' +
                    '</div>';
            });
            chartLegend.innerHTML = legendHtml;
        }

        // 暴露函数到全局作用域，供 HTML onclick 使用
        window.openModal = openModal;
        window.deletePlan = deletePlan;
        window.restorePlan = restorePlan;
        window.permanentDelete = permanentDelete;
    </script>
</body>
</html>
